  @media (min-width:700px){
    .stage{width:min(560px, calc((100svh - 48px) * 0.5625));border-radius:18px;overflow:hidden;
      box-shadow:0 30px 70px -35px rgba(138,90,31,.55),0 0 0 1px rgba(168,116,44,.15)}
  }
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* área do local (clique abre o mapa) */
  .hot{position:absolute;display:block;border-radius:2cqw;-webkit-tap-highlight-color:transparent}
  .hot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .hot-local{left:30%;right:30%;top:62.5%;height:9.2%}

  /* fileira de ícones */
  .btn{
    position:absolute;top:79.15%;width:12cqw;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:1.3cqw;
    text-decoration:none;color:var(--ink);text-align:center;cursor:pointer;
    background:none;border:0;font:inherit;-webkit-tap-highlight-color:transparent;
    opacity:0;animation:pop .7s ease forwards;
  }
  .btn:nth-of-type(1){animation-delay:.6s}.btn:nth-of-type(2){animation-delay:.75s}
  .btn:nth-of-type(3){animation-delay:.9s}.btn:nth-of-type(4){animation-delay:1.05s}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .ic{
    width:8.4cqw;height:8.4cqw;border-radius:50%;display:block;position:relative;
    transition:transform .3s ease,box-shadow .3s ease;background:#fff;
  }
  .ic img,.ic svg{width:100%;height:100%;display:block;border-radius:50%}
  .ic::after{
    content:"";position:absolute;inset:-0.6cqw;border-radius:50%;border:1px solid rgba(168,116,44,.45);
    opacity:0;animation:ring 3.2s ease-out infinite;
  }
  .btn:nth-of-type(2) .ic::after{animation-delay:.8s}
  .btn:nth-of-type(3) .ic::after{animation-delay:1.6s}
  .btn:nth-of-type(4) .ic::after{animation-delay:2.4s}
  @keyframes ring{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.35)}}
  .btn:hover .ic,.btn:focus-visible .ic{transform:translateY(-.6cqw) scale(1.06);box-shadow:0 1.6cqw 3cqw -1.4cqw rgba(138,90,31,.55)}
  .btn:focus-visible{outline:none}
  .lb{font-size:1.72cqw;line-height:1.25;letter-spacing:.01em;white-space:nowrap}

  .b1{left:33.07%}.b2{left:44.62%}.b3{left:56.18%}.b4{left:67.73%}

  /* aviso */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#fff;color:var(--gold-dk);border:1px solid rgba(168,116,44,.45);border-radius:999px;
    padding:12px 22px;font-size:14px;letter-spacing:.04em;box-shadow:0 12px 30px -14px rgba(138,90,31,.5);
    transition:opacity .35s,transform .35s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){
    .stage,.btn{animation:none;opacity:1}.btn{transform:translateX(-50%)}.ic::after{display:none}
  }
</style>
