  :root{
    --azul:#1f3464;
    /* 1 unidade = 1px do design original (444px de largura), escalando com a tela */
    --u:min(calc(100vw / 444), calc(520px / 444));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{display:flex;justify-content:center;min-height:100vh;color:var(--azul);font-family:"Texto",cursive}

  .pagina{position:relative;width:calc(444 * var(--u));min-height:max(100vh, calc(781 * var(--u)));min-height:max(100dvh, calc(781 * var(--u)));overflow:hidden;background:#fff}
  .fundo{position:absolute;pointer-events:none;max-width:none}
  .fundo.papel{left:calc(-450 * var(--u));top:calc(-607 * var(--u));width:calc(1363 * var(--u));height:calc(2019 * var(--u));opacity:.13}
  .fundo.xadrez{left:calc(-431 * var(--u));top:calc(-387 * var(--u));width:calc(2615 * var(--u));height:calc(1743 * var(--u));opacity:.03}

  .conteudo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:calc(40 * var(--u));padding-bottom:calc(236 * var(--u))}
  .relogio{width:calc(165 * var(--u));height:calc(211 * var(--u));display:block}
  h1{font-family:"Titulo",cursive;font-weight:400;font-size:calc(46.6 * var(--u));line-height:1.15;margin-top:calc(8 * var(--u))}
  .intro{font-size:calc(15 * var(--u));line-height:1.45;width:calc(330 * var(--u));margin-top:calc(14 * var(--u))}

  .pix{display:flex;align-items:center;justify-content:center;gap:calc(14 * var(--u));margin-top:calc(42 * var(--u))}
  .pix img{width:calc(62 * var(--u));height:calc(62 * var(--u))}
  .pix .dados{font-size:calc(18.5 * var(--u));line-height:1.45}

  .copiar{margin-top:calc(22 * var(--u));font-family:"Texto",cursive;font-size:calc(15 * var(--u));color:var(--azul);background:rgba(255,255,255,.7);border:1px solid var(--azul);border-radius:999px;padding:calc(4 * var(--u)) calc(22 * var(--u));line-height:1.6;cursor:pointer;transition:background .2s,color .2s}
  .copiar:hover{background:var(--azul);color:#fff}
  .copiar.ok{background:var(--azul);color:#fff}

  .cena{position:absolute;left:0;bottom:0;width:100%;height:calc(216 * var(--u));z-index:1;overflow:hidden}
  .cena img{position:absolute;max-width:none}
</style>
