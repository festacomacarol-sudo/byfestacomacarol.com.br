  .card{
    width:100%;
    max-width:520px;
    position:relative;
    padding: 44px 36px 40px;
    background: linear-gradient(180deg, rgba(10,15,36,0.72), rgba(8,12,30,0.82));
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 30px 70px rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
  }

  .card::before, .card::after{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    border: 1px solid var(--gold-2);
  }
  .card::before{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .card::after{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .logo{
    display:block;
    width: min(320px, 78%);
    margin: 0 auto 6px;
  }

  .eyebrow{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size: 30px;
    line-height:1.3;
    letter-spacing:0.08em;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 65%, var(--gold-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 37px 0 30px;
  }

  @media (max-width:420px){
    .eyebrow{ font-size: 23px; margin-top: 20px; }
  }

  .rule{
    width:64px;
    height:1px;
    margin: 0 auto 30px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
  }

  .invite-text{
    text-align:center;
    font-size: 19px;
    line-height:1.65;
    color: var(--cream);
    margin: 0 0 6px;
    font-weight: 400;
  }

  .invite-details{
    text-align:center;
    font-size: 15.5px;
    line-height:1.75;
    color: rgba(246,240,226,0.78);
    margin: 0 0 32px;
  }

  .invite-details strong{
    color: var(--gold-1);
    font-weight:600;
  }

  form{ margin:0; }

  .field{
    margin-bottom: 22px;
  }

  label{
    display:block;
    font-family:'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--gold-1);
    margin-bottom: 10px;
    font-weight:500;
  }

  input[type="text"], input[type="number"], textarea{
    width:100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(205,164,94,0.4);
    color: var(--cream);
    font-family:'Cormorant Garamond', serif;
    font-size: 17px;
    padding: 12px 14px;
    outline:none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input[type="text"]:focus, input[type="number"]:focus, textarea:focus{
    border-color: var(--gold-1);
    background: rgba(255,255,255,0.06);
  }

  textarea{
    min-height: 90px;
    resize: vertical;
    font-size:16px;
  }

  ::placeholder{ color: rgba(246,240,226,0.35); }

  .toggle-group{
    display:flex;
    gap:12px;
  }

  .toggle-option{
    flex:1;
    text-align:center;
    padding: 12px 10px;
    border: 1px solid rgba(205,164,94,0.4);
    font-family:'Cinzel', serif;
    font-size: 12.5px;
    letter-spacing: 0.1em;
    color: rgba(246,240,226,0.75);
    cursor:pointer;
    transition: all 0.2s ease;
    user-select:none;
  }

  .toggle-option:hover{
    border-color: var(--gold-1);
    color: var(--cream);
  }

  .toggle-option.active{
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
    color: var(--navy-deep);
    border-color: var(--gold-1);
    font-weight:600;
  }

  .companions-field{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.35s ease;
    margin-bottom:0;
  }

  .companions-field.show{
    max-height:140px;
    opacity:1;
    margin-bottom:22px;
  }

  .submit-btn{
    width:100%;
    padding: 15px 10px;
    margin-top: 8px;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3));
    border: none;
    color: var(--navy-deep);
    font-family:'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .submit-btn:hover{
    filter: brightness(1.06);
    box-shadow: 0 8px 24px rgba(205,164,94,0.35);
  }

  .submit-btn:active{ transform: translateY(1px); }

  .submit-btn:disabled{
    opacity:0.6;
    cursor:default;
  }

  .error-msg{
    color: #e6a2ad;
    font-size: 13.5px;
    margin-top: -10px;
    margin-bottom: 18px;
    display:none;
    font-family:'Cormorant Garamond', serif;
  }

  .success-view{
    display:none;
    text-align:center;
  }

  .success-view.show{ display:block; }
  .card.is-success form,
  .card.is-success .invite-text,
  .card.is-success .invite-details,
  .card.is-success .rule{ display:none; }

  .mono{
    width: 56px;
    height:auto;
    margin: 0 auto 22px;
    display:block;
    opacity: 0.92;
  }

  .success-title{
    font-family:'Lavishly Yours', cursive;
    font-size: 42px;
    color: var(--gold-1);
    margin: 0 0 14px;
    line-height:1.1;
  }

  .success-text{
    font-size: 17px;
    line-height:1.7;
    color: rgba(246,240,226,0.85);
    margin:0;
  }

  .success-name{
    color: var(--gold-1);
    font-weight:600;
  }

  @media (max-width:420px){
    .card{ padding: 34px 22px 32px; }
    .invite-text{ font-size:17px; }
    .toggle-group{ gap:8px; }
    .toggle-option{ font-size:11px; padding:11px 6px; }
  }
</style>
</head>

      <p class="success-title">Obrigada!</p>
      <p class="success-text">Sua confirmação foi recebida, <span class="success-name" id="successName"></span>.<br>Mal posso esperar para celebrar esse dia com você.</p>
    </div>

  </div>

<script>
  // 1) Cole aqui a URL da sua implantação do Google Apps Script (Web App)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjmy1wQ6OdrBILwF2ty4mlLpd-zfKaw7KA_7Bc22NucEY1tWOgNdsdtDTbYsfNUdguwg/exec";

  const toggle = document.getElementById('presencaToggle');
  const presencaInput = document.getElementById('presenca');
  const companionsField = document.getElementById('companionsField');
  const acompanhantesInput = document.getElementById('acompanhantes');

  toggle.querySelectorAll('.toggle-option').forEach(opt => {
    opt.addEventListener('click', () => {
      toggle.querySelectorAll('.toggle-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      presencaInput.value = opt.dataset.value;

      if (opt.dataset.value === 'Sim') {
        companionsField.classList.add('show');
        acompanhantesInput.value = acompanhantesInput.value || 1;
      } else {
        companionsField.classList.remove('show');
        acompanhantesInput.value = '';
      }
    });
  });

  const form = document.getElementById('rsvpForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const card = document.getElementById('card');
  const successView = document.getElementById('successView');
  const successName = document.getElementById('successName');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const presenca = presencaInput.value;

    if (!nome || !presenca) {
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    const payload = new FormData();
    payload.append('nome', nome);
    payload.append('presenca', presenca);
    payload.append('acompanhantes', acompanhantesInput.value || '');
    payload.append('data', new Date().toLocaleString('pt-BR'));

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: payload
    })
    .then(() => {
      successName.textContent = nome;
      card.classList.add('is-success');
      successView.classList.add('show');
    })
    .catch(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirmar presença';
      errorMsg.textContent = 'Não foi possível enviar. Verifique sua conexão e tente novamente.';
      errorMsg.style.display = 'block';
    });
  });
</script>
