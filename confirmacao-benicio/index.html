  :root{
    --amarelo:#f6e27a;        /* amarelo aquarela do convite */
    --amarelo-claro:#fbf0b4;
    --amarelo-btn:#f8e9a6;    /* círculos dos ícones do convite */
    --preto:#141414;
    --cinza:#e6e6e8;          /* fundo cinza aquarelado do cartão */
    --cinza-escuro:#cfcfd3;
    --branco:#fdfdfd;
    --hand:'SA Superhero', sans-serif;
    --serif:'SA Superhero', sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--hand);
    color:var(--preto);
    /* fundo amarelo aquarelado */
    background:
      radial-gradient(ellipse 60% 40% at 15% 20%, rgba(255,255,255,.45), transparent 70%),
      radial-gradient(ellipse 50% 35% at 85% 70%, rgba(240,205,70,.45), transparent 70%),
      radial-gradient(ellipse 40% 30% at 70% 15%, rgba(255,246,190,.7), transparent 70%),
      radial-gradient(ellipse 45% 35% at 25% 85%, rgba(236,200,60,.35), transparent 70%),
      var(--amarelo);
    background-attachment:fixed;
    padding:7vw 8vw;
    -webkit-font-smoothing:antialiased;
  }
  /* textura de papel/aquarela por cima de tudo */
  body.com-estampa{background-image:var(--estampa);background-repeat:repeat;background-size:var(--estampa-tam,170px) auto;background-position:center top;background-attachment:scroll}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .72  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .wrap{position:relative;z-index:1;max-width:540px;margin:0 auto}

  /* ===== cartão com moldura preta, como o convite ===== */
  .card{
    position:relative;
    border:clamp(5px,0.9vw,7px) solid var(--preto);
    background:
      radial-gradient(ellipse 70% 30% at 30% 10%, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(ellipse 60% 25% at 80% 45%, rgba(190,190,196,.45), transparent 70%),
      radial-gradient(ellipse 55% 25% at 20% 75%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 60% 30% at 75% 95%, rgba(195,195,200,.45), transparent 70%),
      var(--cinza);
    padding:0 26px;
    box-shadow:0 14px 30px rgba(80,60,0,.18);
  }
  .card::before{ /* manchas de aquarela no cinza */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.008' numOctaves='5' seed='3'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .64  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>");
  }
  .card > *{position:relative}

  /* selo redondo no topo (mesmo estilo dos ícones do convite) */
  .badge{
    position:absolute;top:-38px;left:50%;transform:translateX(-50%);
    width:76px;height:76px;border-radius:50%;
    background:var(--amarelo-btn);border:3px solid var(--preto);
    display:grid;place-items:center;
    box-shadow:0 0 0 6px var(--cinza);
  }
  .badge svg{width:40px;height:40px}

  /* artes opcionais nos cantos (use as PNGs do próprio convite) */
  .art{position:absolute;pointer-events:none;display:none;z-index:2}
  .art.on{display:block}
  /* só a cabeça aparecendo: o corpo fica escondido acima da moldura */
  .art-topo{top:0;left:-6%;width:36%;transform:translateY(-12%)}
  .card{overflow:hidden}

  header{text-align:center;margin-bottom:26px}
  .logo-wrap{position:relative;display:grid;place-items:center;padding-top:56%}
  .logo-wrap .logo{display:none;width:80%;height:auto}
  .logo-wrap.on .logo{display:block}
  .logo-wrap.on .sobre-logo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  /* personagens da base: posições medidas no convite */
  .herois{display:none;position:relative;aspect-ratio:1135/940;margin:24px -26px 0;overflow:hidden}
  .herois.on{display:block}
  .herois img{display:none;position:absolute;height:auto}
  .herois img.on{display:block}
  #arteBase1{left:-36%;top:0;width:85%;z-index:1}
  #arteBase2{left:39.4%;top:39.7%;width:40%;z-index:2}
  #arteBase3{left:66.5%;top:34%;width:48%;z-index:3}
  @media (max-width:380px){.herois{margin:20px -18px 0}}
  .kicker{font-size:15px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5}
  h1.nome{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(46px,13vw,68px);line-height:.95;letter-spacing:.01em;
    margin:10px 0 0;
  }
  .idade{font-size:26px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .titulo{
    font-size:clamp(17px,5.2vw,27px);letter-spacing:.08em;text-transform:uppercase;line-height:1.3;
    white-space:nowrap;text-align:center;margin-top:20px;
  }
  .subtitulo{font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

  .data{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;
  }
  .data .dia{font-size:58px;line-height:1;font-style:italic;transform:skewX(-6deg)}
  .data .mes{font-size:22px;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;text-align:left}
  .local{font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

  .divisor{border:none;border-top:2.5px dashed var(--preto);opacity:.55;margin:22px 0 18px}

  /* ===== formulário ===== */
  form{display:grid;gap:16px}
  .campo label,.rot{
    display:block;font-size:17px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;
  }
  .opc{font-size:14px;letter-spacing:.04em;text-transform:none;opacity:.7}
  input[type=text],input[type=tel],textarea{
    width:100%;font-family:var(--hand);font-size:19px;color:var(--preto);
    background:var(--branco);
    border:2.5px solid var(--preto);border-radius:12px;
    padding:11px 14px;outline:none;
    transition:box-shadow .15s, background .15s;
  }
  textarea{min-height:84px;resize:vertical;line-height:1.35}
  input::placeholder,textarea::placeholder{color:#8a8a8f}
  input:focus,textarea:focus{box-shadow:4px 4px 0 var(--preto);background:#fffef6}
  .erro input{border-color:#b3261e;background:#fff4f2}

  /* Sim / Não */
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle button{
    font-family:var(--hand);font-size:15px;letter-spacing:.06em;color:#3a3a3a;
    background:rgba(255,255,255,.75);border:1.5px solid #9a9a9a;border-radius:999px;
    padding:9px 6px;cursor:pointer;transition:background .2s, border-color .2s, color .2s;
  }
  .toggle button[aria-pressed=true]{background:var(--amarelo-btn);border-color:var(--preto);color:var(--preto)}
  .toggle button:active{transform:scale(.98)}

  /* contadores */
  .contadores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .contadores small{display:block;font-size:15px;letter-spacing:.06em;margin-bottom:4px}
  .stepper{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--branco);border:2.5px solid var(--preto);border-radius:12px;padding:6px;
  }
  .stepper button{
    width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer;
    background:var(--amarelo-btn);border:2.5px solid var(--preto);
    font-family:var(--serif);font-size:22px;line-height:1;color:var(--preto);
    display:grid;place-items:center;
  }
  .stepper button:active{transform:scale(.92)}
  .stepper output{font-size:26px;min-width:30px;text-align:center}

  .bloco-vem{display:grid;gap:16px;transition:opacity .2s}
  .bloco-vem[hidden]{display:none}

  /* botão principal */
  .enviar{
    margin-top:4px;
    font-family:var(--hand);font-size:21px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    color:var(--preto);background:var(--amarelo-btn);
    border:3px solid var(--preto);border-radius:999px;padding:14px 18px;cursor:pointer;
    box-shadow:5px 5px 0 var(--preto);transition:transform .1s, box-shadow .1s;
  }
  .enviar:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--preto)}
  .enviar:disabled{opacity:.6;cursor:wait}

  .msg-erro{color:#b3261e;font-size:17px;text-align:center;min-height:1em}

  .rodape{text-align:center;margin-top:22px}
  .rodape p{font-size:16px;letter-spacing:.1em;text-transform:uppercase;line-height:1.45}
  .mapa{
    display:inline-flex;align-items:center;gap:10px;margin-top:14px;
    color:var(--preto);text-decoration:none;font-size:16px;letter-spacing:.1em;text-transform:uppercase;
  }
  .mapa span.ic{
    width:52px;height:52px;border-radius:50%;background:var(--amarelo-btn);border:2.5px solid var(--preto);
    display:grid;place-items:center;flex:none;
  }
  .mapa svg{width:26px;height:26px}

  /* tela de sucesso */
  .sucesso{display:none;text-align:center;padding:10px 0 4px}
  .sucesso.on{display:block;animation:pop .35s ease-out}
  .sucesso h2{font-size:34px;letter-spacing:.1em;text-transform:uppercase;line-height:1.1}
  .sucesso p{font-size:20px;margin-top:10px;line-height:1.4}
  .sucesso .ic-ok{
    width:90px;height:90px;margin:0 auto 14px;border-radius:50%;
    background:var(--amarelo-btn);border:3px solid var(--preto);display:grid;place-items:center;
  }
  .sucesso .ic-ok svg{width:48px;height:48px}
  .outra{
    margin-top:18px;background:none;border:none;font-family:var(--hand);font-size:17px;
    text-decoration:underline;cursor:pointer;color:var(--preto);letter-spacing:.06em;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

  @media (max-width:380px){
    .card{padding:0 18px}
  }
  /* no computador: cartão colado no topo, sem a faixa amarela em cima/embaixo */
  @media (min-width:700px){
    body{padding:0 24px}
    .card{border-top:none;border-bottom:none;min-height:100vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <img class="art art-topo" id="artTopo" alt="">

    <header>
      <div class="logo-wrap" id="logoWrap">
        <img class="logo" id="logo" alt="Benício 3 anos">
        <div class="sobre-logo">
          <h1 class="nome">BENÍCIO</h1>
          <p class="idade">3 anos</p>
        </div>
      </div>
      <h2 class="titulo">Confirme sua presença</h2>
    </header>


    <!-- FORMULÁRIO -->
    <form id="rsvp" novalidate>
      <div class="campo" id="cNome">
        <label for="nome">Seu nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Ana Souza" autocomplete="name" required>
      </div>

      <div class="campo" id="cZap">
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" name="whatsapp" placeholder="(21) 99999-9999" inputmode="numeric" autocomplete="tel" maxlength="15" required>
      </div>

      <div>
        <span class="rot">Você vem?</span>
        <div class="toggle" role="group" aria-label="Você vem?">
          <button type="button" data-vem="Sim" aria-pressed="true">Sim, estarei lá!</button>
          <button type="button" data-vem="Não" aria-pressed="false">Não poderei ir</button>
        </div>
      </div>

      <div class="bloco-vem" id="blocoVem">
        <div>
          <span class="rot">Quantas pessoas, contando você?</span>
          <div class="contadores">
            <div>
              <small>Adultos</small>
              <div class="stepper" data-campo="adultos" data-min="1">
                <button type="button" data-d="-1" aria-label="Menos adultos">−</button>
                <output id="adultos">1</output>
                <button type="button" data-d="1" aria-label="Mais adultos">+</button>
              </div>
            </div>
            <div>
              <small>Crianças</small>
              <div class="stepper" data-campo="criancas" data-min="0">
                <button type="button" data-d="-1" aria-label="Menos crianças">−</button>
                <output id="criancas">0</output>
                <button type="button" data-d="1" aria-label="Mais crianças">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="campo">
          <label for="acompanhantes">Nome dos acompanhantes <span class="opc">(opcional)</span></label>
          <textarea id="acompanhantes" name="acompanhantes" placeholder="Ex.: Pedro (pai), Lia (5 anos)"></textarea>
        </div>
      </div>

      <div class="campo">
        <label for="recado">Recadinho para o Benício <span class="opc">(opcional)</span></label>
        <textarea id="recado" name="recado" placeholder="Escreva um carinho..."></textarea>
      </div>

      <p class="msg-erro" id="msgErro" role="alert"></p>
      <button type="submit" class="enviar" id="btnEnviar">Confirmar presença</button>
    </form>

    <!-- SUCESSO -->
    <section class="sucesso" id="sucesso" aria-live="polite">
      <div class="ic-ok" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <h2 id="sucTitulo">Missão confirmada!</h2>
      <p id="sucTexto"></p>
      <button type="button" class="outra" id="outra">Enviar outra confirmação</button>
    </section>

    <!-- artes da base do cartão (na ordem: esquerda, meio, direita) -->
    <div class="herois" id="herois">
      <img id="arteBase1" alt="">
      <img id="arteBase2" alt="">
      <img id="arteBase3" alt="">
    </div>
  </main>
</div>

(() => {
  const $ = s => document.querySelector(s);
  const form = $('#rsvp'), btn = $('#btnEnviar'), erro = $('#msgErro');
  let vem = 'Sim';

  // carrega cada arte só se o arquivo existir (se faltar, a página continua bonita sem ela)
  const carregar = (el, src, ok) => {
    if (!src) return;
    el.onload = () => { el.classList.add('on'); ok && ok(); };
    el.src = src;
  };
  if (CONFIG.ESTAMPA) {
    const t = new Image();
    t.onload = () => {
      document.body.style.setProperty('--estampa', `url("${CONFIG.ESTAMPA}")`);
      document.body.style.setProperty('--estampa-tam', CONFIG.ESTAMPA_TAM);
      document.body.classList.add('com-estampa');
    };
    t.src = CONFIG.ESTAMPA;
  }
  carregar($('#logo'), CONFIG.LOGO, () => $('#logoWrap').classList.add('on'));
  carregar($('#artTopo'), CONFIG.ARTE_TOPO, () => $('.card').classList.add('com-arte-topo'));
  (CONFIG.ARTES_BASE || []).forEach((src, i) => {
    const el = $('#arteBase' + (i + 1));
    if (el) carregar(el, src, () => $('#herois').classList.add('on'));
  });

  // máscara WhatsApp
  const zap = $('#whatsapp');
  zap.addEventListener('input', () => {
    let d = zap.value.replace(/\D/g, '').slice(0, 11);
    if (d.length > 6) zap.value = `(${d.slice(0,2)}) ${d.slice(2, d.length > 10 ? 7 : 6)}-${d.slice(d.length > 10 ? 7 : 6)}`;
    else if (d.length > 2) zap.value = `(${d.slice(0,2)}) ${d.slice(2)}`;
    else zap.value = d ? `(${d}` : '';
  });

  // Sim / Não
  document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
    vem = b.dataset.vem;
    document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#blocoVem').hidden = vem !== 'Sim';
  }));

  // contadores
  document.querySelectorAll('.stepper').forEach(st => {
    const out = st.querySelector('output'), min = +st.dataset.min;
    st.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      out.value = out.textContent = Math.min(20, Math.max(min, +out.textContent + +b.dataset.d));
    }));
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    erro.textContent = '';
    $('#cNome').classList.remove('erro'); $('#cZap').classList.remove('erro');

    const nome = $('#nome').value.trim();
    const telefone = zap.value.replace(/\D/g, '');
    if (nome.length < 3) { $('#cNome').classList.add('erro'); erro.textContent = 'Escreva seu nome completo, por favor.'; $('#nome').focus(); return; }
    if (telefone.length < 10) { $('#cZap').classList.add('erro'); erro.textContent = 'Confere o WhatsApp com DDD?'; zap.focus(); return; }

    const adultos = vem === 'Sim' ? +$('#adultos').textContent : 0;
    const criancas = vem === 'Sim' ? +$('#criancas').textContent : 0;
    const dados = new URLSearchParams({
      nome, whatsapp: zap.value, presenca: vem,
      adultos, criancas, total: adultos + criancas,
      acompanhantes: vem === 'Sim' ? $('#acompanhantes').value.trim() : '',
      recado: $('#recado').value.trim()
    });

    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      if (!CONFIG.SCRIPT_URL.startsWith('https://')) throw new Error('URL do Apps Script não configurada');
      await fetch(CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: dados });
      mostrarSucesso(nome.split(' ')[0], adultos + criancas);
    } catch (err) {
      console.error(err);
      erro.textContent = 'Ops! Não conseguimos enviar. Tente de novo em instantes.';
    } finally {
      btn.disabled = false; btn.textContent = 'Confirmar presença';
    }
  });

  function mostrarSucesso(primeiro, total) {
    form.style.display = 'none';
    if (vem === 'Sim') {
      $('#sucTitulo').textContent = 'Missão confirmada!';
      $('#sucTexto').textContent = `Oba, ${primeiro}! ${total > 1 ? `Seu esquadrão de ${total} heróis está` : 'Você está'} na lista do ${CONFIG.ANIVERSARIANTE}. Nos vemos lá!`;
    } else {
      $('#sucTitulo').textContent = 'Recebido!';
      $('#sucTexto').textContent = `Que pena, ${primeiro}! Obrigado por avisar. O ${CONFIG.ANIVERSARIANTE} vai sentir sua falta.`;
    }
    $('#sucesso').classList.add('on');
    $('#sucesso').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('#outra').addEventListener('click', () => {
    form.reset(); zap.value = '';
    $('#adultos').textContent = '1'; $('#criancas').textContent = '0';
    document.querySelector('[data-vem="Sim"]').click();
    $('#sucesso').classList.remove('on'); form.style.display = '';
  });
})();
</script>
</body>
</html>
