<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEECE7">
<title>Dress Code — Luna Vendramini XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<!-- ============================================================
     PÁGINA DO CONVITE DA LUNA — como editar
     Procure a palavra EDITAR neste arquivo: ela marca todo texto de
     exemplo que precisa ser conferido/substituído antes de publicar.
     Cores e fontes: bloco :root no <style>.
     ============================================================ -->
<style>
  :root{
    /* ---------- IDENTIDADE VISUAL: troque aqui se precisar ---------- */
    --paper:#EEECE7;       /* papel de fundo */
    --cream:#EAE3D6;       /* chapas e cartões bege */
    --cream-hi:#F5F1E8;
    --ink:#141210;         /* preto do envelope */
    --ink-soft:#141210;
    --line:rgba(20,18,16,.18);
    --gold-1:#7B5218; --gold-2:#D9B461; --gold-3:#A8731E; --gold-4:#EBD08E;
    --font-script:'Mrs Saint Delafield','Pinyon Script','Snell Roundhand',cursive;
    --font-serif:'Cormorant Garamond','Cormorant',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-serif);
    font-size:1.2rem;font-weight:500;line-height:1.5;min-height:100vh;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  /* textura de papel */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.6),transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .28  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
  :focus-visible{outline:2px solid var(--gold-3);outline-offset:3px;}
  .page{max-width:720px;margin:0 auto;padding:20px 22px 70px;text-align:center;}

  /* dourado com brilho (igual aos textos do convite) */
  .gold{
    background:linear-gradient(95deg,#6B440F 0%,#B98A33 30%,#8A5A14 55%,#C9A04A 78%,#7B5218 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.6px rgba(107,68,15,.8);
  }
  /* dourado mais brilhante sobre fundo preto */
  .plaque.black .gold,.reserved .gold{
    background-image:linear-gradient(95deg,#B98A33 0%,#EBD08E 30%,#D9B461 55%,#F3DFA6 78%,#C9A04A 100%);
    -webkit-text-stroke:.4px rgba(235,208,142,.55);
  }
  .script{font-family:var(--font-script);font-weight:400;line-height:1;}
  .script.gold{padding:.28em .4em .16em .2em;}

  /* topo */
  .topbar{display:flex;justify-content:flex-start;}
  .back{
    display:inline-flex;align-items:center;min-height:44px;padding:0 4px;
    font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);
  }
  .back:hover{color:var(--ink);}
  .mono{display:block;width:150px;margin:4px auto 0;}
  .mono img{display:block;width:100%;height:auto;}

  /* chapas do convite (imagens reais) */
  .plaque-img{width:min(88%,520px);margin:22px auto 0;}
  .plaque-img img{display:block;width:100%;height:auto;
    filter:drop-shadow(0 16px 16px rgba(30,20,10,.28)) drop-shadow(0 2px 3px rgba(30,20,10,.18));}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* arco (Dress Code) */
  .arch{
    position:relative;width:min(300px,80%);aspect-ratio:300/345;margin:26px auto 0;
    border-radius:150px 150px 16px 16px;
    background:linear-gradient(180deg,#F5F0E6,#E3DAC9);
    box-shadow:0 14px 22px rgba(40,30,15,.22),inset 0 0 0 1px rgba(255,255,255,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .arch::before{content:'';position:absolute;inset:12px;border-radius:138px 138px 8px 8px;border:1px solid rgba(120,100,60,.42);}
  .arch small{font-size:1.05rem;letter-spacing:.06em;color:var(--ink-soft);position:relative;}
  .arch h1{font-size:clamp(4.2rem,17vw,6rem);color:var(--ink);position:relative;line-height:.9;margin-top:6px;}

  /* seções */
  .sec{margin-top:68px;}
  .label{font-size:.82rem;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px auto 22px;max-width:260px;}
  .orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(168,115,30,.7));}
  .orn::after{background:linear-gradient(270deg,transparent,rgba(168,115,30,.7));}
  .orn i{width:7px;height:7px;background:var(--gold-3);transform:rotate(45deg);}
  .big{font-size:clamp(1.8rem,6.6vw,2.4rem);line-height:1.2;}
  .caps{letter-spacing:.06em;text-transform:uppercase;}
  .sub{color:var(--ink-soft);font-size:1.25rem;margin-top:4px;}
  .lead{font-size:1.4rem;font-style:italic;color:var(--ink-soft);max-width:480px;margin:0 auto;}

  /* botões */
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;
    border-radius:999px;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    background:var(--ink);color:var(--gold-4);border:1px solid var(--ink);
    transition:background .25s,color .25s,transform .2s;
  }
  .btn:hover{background:#2a2622;transform:translateY(-1px);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.ghost:hover{background:var(--ink);color:var(--gold-4);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none;}

  /* cartões de papel */
  .card{
    position:relative;background:rgba(245,241,232,.7);border:1px solid var(--line);border-radius:14px;
    padding:28px 24px;box-shadow:0 8px 18px rgba(40,30,15,.08);
  }
  .card::after{content:'';position:absolute;inset:6px;border:1px solid rgba(168,115,30,.32);border-radius:9px;pointer-events:none;}

  /* mapa */
  .map{margin-top:30px;border-radius:14px;overflow:hidden;border:1px solid rgba(168,115,30,.45);box-shadow:0 8px 18px rgba(40,30,15,.12);}
  .map iframe{display:block;width:100%;height:300px;border:0;filter:grayscale(1) contrast(1.05) sepia(.15);}

  /* programação */
  .timeline{list-style:none;max-width:460px;margin:8px auto 0;text-align:left;position:relative;}
  .timeline li{display:grid;grid-template-columns:70px 22px 1fr;align-items:start;gap:10px;padding:14px 0;position:relative;}
  .timeline .t{text-align:right;font-weight:700;letter-spacing:.04em;}
  .timeline .d{position:relative;height:100%;}
  .timeline .d::before{content:'';position:absolute;left:50%;top:-14px;bottom:-14px;width:1px;background:rgba(168,115,30,.5);}
  .timeline li:first-child .d::before{top:14px;}
  .timeline li:last-child .d::before{bottom:calc(100% - 14px);}
  .timeline .d::after{content:'';position:absolute;left:50%;top:8px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--gold-3);}
  .timeline .x{font-size:1.3rem;}

  /* paleta do dress code */
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;margin-top:8px;}
  .sw{width:92px;}
  .sw i{display:block;width:58px;height:58px;border-radius:50%;margin:0 auto 10px;border:1px solid rgba(20,18,16,.25);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 6px 10px rgba(40,30,15,.14);}
  .sw span{display:block;font-size:1.05rem;line-height:1.2;}
  .reserved{background:var(--ink);color:var(--cream-hi);border-radius:16px;padding:32px 24px;position:relative;box-shadow:0 12px 22px rgba(20,18,16,.35);}
  .reserved::after{content:'';position:absolute;inset:7px;border:1px solid rgba(217,180,97,.5);border-radius:10px;pointer-events:none;}
  .reserved .label{color:var(--gold-2);}
  .reserved .name{font-size:clamp(2.6rem,11vw,3.6rem);margin:6px auto 2px;width:auto;max-width:100%;}
  .reserved i{display:block;width:46px;height:46px;border-radius:50%;margin:0 auto;border:2px solid var(--gold-2);}
  .reserved p{max-width:420px;margin:0 auto;font-size:1.2rem;color:#E4DCCB;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:center;}
  @media(max-width:600px){.cols{grid-template-columns:1fr;}}
  .cols h3{font-family:var(--font-script);font-weight:400;font-size:3.2rem;line-height:1;margin-bottom:4px;}
  .cols p{font-size:1.15rem;color:var(--ink-soft);}

  /* presentes */
  .gifts{display:flex;flex-direction:column;gap:18px;text-align:left;}
  .gift{display:grid;grid-template-columns:1fr auto;gap:10px 22px;align-items:center;}
  .gift h3{font-size:1.65rem;font-weight:600;line-height:1.15;}
  .gift p{font-size:1.12rem;color:var(--ink-soft);margin-top:4px;}
  .gift .price{font-style:italic;font-size:1.5rem;margin-top:8px;display:block;}
  .gift .st{display:block;margin-top:8px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold-1);}
  .gift .side{align-self:center;}
  @media(max-width:560px){.gift{grid-template-columns:1fr;}.gift .btn{width:100%;}}
  .fine{font-size:1.05rem;color:var(--ink-soft);margin-top:22px;font-style:italic;}

  /* navegação entre páginas e rodapé */
  .more{margin-top:76px;}
  .more .btns{margin-top:16px;}
  .closing{margin-top:76px;}
  .closing .espero{font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase;}
  .closing .mono{width:210px;margin-top:10px;}

  /* modal e aviso */
  .overlay{position:fixed;inset:0;background:rgba(20,18,16,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;padding:42px 30px 30px;position:relative;border-radius:16px;max-height:94vh;overflow-y:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .modal::after{content:'';position:absolute;inset:7px;border:1px solid rgba(168,115,30,.4);border-radius:11px;pointer-events:none;}
  .modal h3{font-family:var(--font-script);font-weight:400;font-size:3.4rem;line-height:1;}
  .modal p{color:var(--ink-soft);font-size:1.12rem;margin-top:8px;}
  .modal .x{position:absolute;top:12px;right:14px;font-size:1.3rem;padding:10px;color:var(--ink-soft);z-index:2;}
  .timer{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:20px 0 14px;}
  .timer b{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .timer span{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);}
  .field{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(20,18,16,.3);padding:12px 2px;font:inherit;font-size:1.15rem;color:var(--ink);margin-bottom:10px;border-radius:0;}
  .field:focus{outline:none;border-color:var(--ink);}
  .field::placeholder{color:var(--ink-soft);opacity:.8;}
  .modal .btn{width:100%;margin-top:10px;position:relative;z-index:2;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--gold-4);padding:14px 26px;border-radius:999px;font-size:1.05rem;opacity:0;pointer-events:none;transition:all .3s;z-index:120;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}


  /* título em imagem manuscrita */
  .title-img{width:min(60%,230px);margin:0 auto 10px;font-size:0;}
  .title-img img{display:block;width:100%;height:auto;}
  .title-img.ela,.title-img.eles{width:min(62%,250px);margin-bottom:0;}
  .blacktie{font-family:var(--font-serif);font-size:clamp(2.1rem,8vw,2.8rem);letter-spacing:.14em;text-transform:uppercase;font-weight:600;line-height:1.1;}
  .plaque-img.dc{width:min(92%,540px);margin-top:14px;}
  /* aviso de cor reservada */
  .reserved .dots{display:flex;gap:16px;justify-content:center;margin:12px 0 4px;}
  .reserved .dots i{margin:0;width:46px;height:46px;}
  .reserved .dots i.w{background:#F5F1E8;border-color:var(--gold-2);}
  .reserved .dots i.b{background:#000;border-color:var(--gold-2);box-shadow:0 0 0 1px rgba(255,255,255,.25);}
  .aviso-tag{display:inline-block;border:1px solid var(--gold-2);color:var(--gold-2);border-radius:999px;padding:4px 16px;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;margin-bottom:8px;}

  /* aviso: cores reservadas (delicado) */
  .notice{position:relative;max-width:420px;margin:0 auto;padding:30px 26px 28px;border-radius:18px;
    background:linear-gradient(180deg,rgba(250,247,240,.85),rgba(240,234,222,.75));
    border:1px solid rgba(168,115,30,.35);box-shadow:0 10px 24px rgba(40,30,15,.08);}
  .notice::after{content:'';position:absolute;inset:6px;border:1px solid rgba(168,115,30,.22);border-radius:13px;pointer-events:none;}
  .n-tag{font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:var(--gold-3);}
  .n-label{font-size:.82rem;letter-spacing:.34em;text-transform:uppercase;font-weight:600;margin-top:6px;}
  .notice .orn{margin:12px auto 10px;max-width:180px;}
  .title-img.pb{width:min(70%,260px);margin:0 auto 6px;}
  .notice .dots{display:flex;gap:14px;justify-content:center;margin:8px 0 14px;}
  .notice .dots i{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold-3);box-shadow:0 0 0 3px rgba(245,241,232,.9),0 0 0 4px rgba(168,115,30,.35);}
  .notice .dots i.b{background:#141210;} .notice .dots i.w{background:#fff;}
  .n-men{font-size:1rem;letter-spacing:.04em;margin-top:10px;padding-top:10px;border-top:1px solid rgba(168,115,30,.3);font-weight:600;}
  .n-text{font-size:1.12rem;font-style:italic;line-height:1.45;}
  /* carrossel Ela / Ele */
  .looks{margin-top:68px;}
  .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:0;border-radius:16px;}
  .track::-webkit-scrollbar{display:none;}
  .look{flex:0 0 100%;scroll-snap-align:center;padding:6px 8px 4px;}
  .look .fig{width:min(78%,330px);margin:14px auto 0;}
  .look .fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 12px rgba(30,20,10,.22));}
  .look .desc{font-size:1.35rem;font-weight:600;margin-top:12px;line-height:1.25;}
  .look .desc small{display:block;font-size:1.1rem;font-weight:500;font-style:italic;margin-top:2px;}
  .swipe{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px;}
  .swipe .dot{width:9px;height:9px;border-radius:50%;background:rgba(20,18,16,.25);transition:all .25s;}
  .swipe .dot.on{background:var(--gold-3);transform:scale(1.35);}
  .arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;line-height:1;background:transparent;}
  .arrow:hover{background:var(--ink);color:var(--gold-4);}
  .hint{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;margin-top:10px;}

  /* entrada suave */
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .rise{animation:rise .9s ease both;animation-delay:var(--d,0s);}
  @media(prefers-reduced-motion:reduce){.rise{animation:none;}html{scroll-behavior:auto;}}
</style>
</head>

<script>
  const track=document.getElementById('track'), dots=[d0,d1];
  const go=i=>track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});
  const cur=()=>Math.round(track.scrollLeft/track.clientWidth);
  prev.onclick=()=>go(Math.max(0,cur()-1)); next.onclick=()=>go(Math.min(1,cur()+1));
  track.addEventListener('scroll',()=>{const c=cur();dots.forEach((d,i)=>d.classList.toggle('on',i===c));},{passive:true});
</script>
