<style>
  :root {
    --papel: #e9e8e5;
    --preto: #1b1b1b;
    --ouro-claro: #e9c876;
    --ouro: #c8962f;
    --ouro-escuro: #8a5a12;
    /* largura da capa: cabe inteira em qualquer tela, sem cortar */
    --w: min(100vw, calc(100vh * 9 / 16));
  }
  @supports (height: 100dvh) {
    :root { --w: min(100vw, calc(100dvh * 9 / 16)); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--papel); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* A capa inteira é o link */
  .capa {
    position: relative;
    display: block;
    width: var(--w);
    aspect-ratio: 9 / 16;
    text-decoration: none;
    cursor: pointer;
    outline: none;
    animation: surgir 1.1s ease-out both;
  }
  .capa img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Botão "Clique aqui" no espaço livre abaixo do envelope */
  .botao {
    position: absolute;
    left: 50%;
    top: 80.5%;
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--w) * 0.036) calc(var(--w) * 0.105);
    border-radius: 999px;
    background: var(--preto);
    border: 1px solid var(--ouro);
    box-shadow:
      0 calc(var(--w) * 0.014) calc(var(--w) * 0.04) rgba(0, 0, 0, .22),
      inset 0 0 0 calc(var(--w) * 0.006) var(--preto),
      inset 0 0 0 calc(var(--w) * 0.008) rgba(200, 150, 47, .45);
    font-family: "Cormorant Garamond", "Didot", "Bodoni MT", "Times New Roman", serif;
    font-weight: 600;
    font-size: calc(var(--w) * 0.05);
    line-height: 1;
    letter-spacing: .3em;
    text-indent: .3em; /* compensa o espaçamento da última letra */
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease;
    animation: pulsar 2.6s ease-in-out 1.2s infinite;
  }
  .botao span {
    background: linear-gradient(100deg, var(--ouro-escuro) 0%, var(--ouro) 28%, var(--ouro-claro) 50%, var(--ouro) 72%, var(--ouro-escuro) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: brilho 3.6s linear infinite;
  }
  .capa:hover .botao,
  .capa:focus-visible .botao {
    transform: translate(-50%, -50%) scale(1.05);
    animation-play-state: paused;
  }
  .capa:active .botao { transform: translate(-50%, -50%) scale(.97); }
  .capa:focus-visible .botao { outline: 2px solid var(--ouro); outline-offset: 4px; }

  @keyframes surgir {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pulsar {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.045); }
  }
  @keyframes brilho {
    from { background-position: 220% 0; }
    to   { background-position: 0% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .capa, .botao, .botao span { animation: none; }
  }
</style>
</head>
