<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEECE7">
<title>Painel de avisos — Luna Vendramini XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<!-- ============================================================
     PAINEL DOS ASSESSORES — não divulgue o endereço desta página aos convidados.
     Antes de usar (uma vez só, no console do Firebase):
       1. Authentication > Método de login > ative "E-mail/senha".
       2. Authentication > Usuários > "Adicionar usuário": crie o e-mail e a senha de cada assessor.
       3. Firestore > Regras: cole as regras do bloco SECURITY RULES do arquivo
          lista-de-presentes.html e troque os e-mails em "notices" pelos dos assessores.
       4. Cole o firebaseConfig logo abaixo (o mesmo dos outros arquivos).
     ============================================================ -->
<style>
  :root{
    /* ---------- IDENTIDADE VISUAL: troque aqui se precisar ---------- */
    --paper:#EEECE7;       /* papel de fundo */
    --cream:#EAE3D6;       /* chapas e cartões bege */
    --cream-hi:#F5F1E8;
    --ink:#141210;         /* preto do envelope */
    --ink-soft:#4C4741;
    --line:rgba(20,18,16,.18);
    --gold-1:#7B5218; --gold-2:#D9B461; --gold-3:#A8731E; --gold-4:#EBD08E;
    --font-script:'Mrs Saint Delafield','Pinyon Script','Snell Roundhand',cursive;
    --font-serif:'Cormorant Garamond','Cormorant',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-serif);
    font-size:1.2rem;font-weight:500;line-height:1.5;min-height:100vh;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  /* textura de papel */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.6),transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .28  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
  :focus-visible{outline:2px solid var(--gold-3);outline-offset:3px;}
  .page{max-width:720px;margin:0 auto;padding:20px 22px 70px;text-align:center;}

  /* dourado com brilho (igual aos textos do convite) */
  .gold{
    background:linear-gradient(95deg,#6B440F 0%,#B98A33 30%,#8A5A14 55%,#C9A04A 78%,#7B5218 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.6px rgba(107,68,15,.8);
  }
  /* dourado mais brilhante sobre fundo preto */
  .plaque.black .gold,.reserved .gold{
    background-image:linear-gradient(95deg,#B98A33 0%,#EBD08E 30%,#D9B461 55%,#F3DFA6 78%,#C9A04A 100%);
    -webkit-text-stroke:.4px rgba(235,208,142,.55);
  }
  .script{font-family:var(--font-script);font-weight:400;line-height:1;}
  .script.gold{padding:.28em .4em .16em .2em;}

  /* topo */
  .topbar{display:flex;justify-content:flex-start;}
  .back{
    display:inline-flex;align-items:center;min-height:44px;padding:0 4px;
    font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);
  }
  .back:hover{color:var(--ink);}
  .mono{display:block;width:150px;margin:4px auto 0;}
  .mono img{display:block;width:100%;height:auto;}

  /* chapas do convite (imagens reais) */
  .plaque-img{width:min(88%,520px);margin:22px auto 0;}
  .plaque-img img{display:block;width:100%;height:auto;
    filter:drop-shadow(0 16px 16px rgba(30,20,10,.28)) drop-shadow(0 2px 3px rgba(30,20,10,.18));}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* arco (Dress Code) */
  .arch{
    position:relative;width:min(300px,80%);aspect-ratio:300/345;margin:26px auto 0;
    border-radius:150px 150px 16px 16px;
    background:linear-gradient(180deg,#F5F0E6,#E3DAC9);
    box-shadow:0 14px 22px rgba(40,30,15,.22),inset 0 0 0 1px rgba(255,255,255,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .arch::before{content:'';position:absolute;inset:12px;border-radius:138px 138px 8px 8px;border:1px solid rgba(120,100,60,.42);}
  .arch small{font-size:1.05rem;letter-spacing:.06em;color:var(--ink-soft);position:relative;}
  .arch h1{font-size:clamp(4.2rem,17vw,6rem);color:var(--ink);position:relative;line-height:.9;margin-top:6px;}

  /* seções */
  .sec{margin-top:68px;}
  .label{font-size:.82rem;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .title-img{width:min(66%,280px);margin:0 auto 18px;font-size:0;}
  .title-img img{display:block;width:100%;height:auto;}
  .title-img.data{width:calc(min(66%,280px) * .965);}
  .title-text{font-family:var(--font-script);font-weight:400;font-size:clamp(3.2rem,14vw,4rem);line-height:1.05;color:var(--ink);margin:0 auto;}
  .venue{font-size:clamp(1.15rem,4.4vw,1.4rem);letter-spacing:.16em;text-transform:uppercase;line-height:1.3;font-weight:600;}
  .venue-addr{font-size:1.05rem;color:var(--ink-soft);margin-top:6px;}
  .board{display:flex;flex-direction:column;gap:16px;margin-top:26px;text-align:left;}
  .notice{padding:22px 22px 20px;}
  .notice .tag{display:flex;justify-content:space-between;gap:12px;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--ink);}
  .notice .tag time{letter-spacing:.1em;font-weight:600;}
  .notice h3{font-size:1.5rem;font-weight:600;line-height:1.2;margin:10px 0 4px;}
  .notice p{font-size:1.12rem;color:var(--ink);white-space:pre-line;}
  .board .empty{text-align:center;font-style:italic;font-size:1.2rem;color:var(--ink);}
  .orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px auto 22px;max-width:260px;}
  .orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(168,115,30,.7));}
  .orn::after{background:linear-gradient(270deg,transparent,rgba(168,115,30,.7));}
  .orn i{width:7px;height:7px;background:var(--gold-3);transform:rotate(45deg);}
  .big{font-size:clamp(1.8rem,6.6vw,2.4rem);line-height:1.2;}
  .caps{letter-spacing:.06em;text-transform:uppercase;}
  .sub{color:var(--ink-soft);font-size:1.25rem;margin-top:4px;}
  .lead{font-size:1.4rem;font-style:italic;color:var(--ink-soft);max-width:480px;margin:0 auto;}

  /* botões */
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;
    border-radius:999px;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    background:var(--ink);color:var(--gold-4);border:1px solid var(--ink);
    transition:background .25s,color .25s,transform .2s;
  }
  .btn:hover{background:#2a2622;transform:translateY(-1px);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.ghost:hover{background:var(--ink);color:var(--gold-4);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none;}

  /* cartões de papel */
  .card{
    position:relative;background:rgba(245,241,232,.7);border:1px solid var(--line);border-radius:14px;
    padding:28px 24px;box-shadow:0 8px 18px rgba(40,30,15,.08);
  }
  .card::after{content:'';position:absolute;inset:6px;border:1px solid rgba(168,115,30,.32);border-radius:9px;pointer-events:none;}

  /* mapa */
  .map{margin-top:30px;border-radius:14px;overflow:hidden;border:1px solid rgba(168,115,30,.45);box-shadow:0 8px 18px rgba(40,30,15,.12);}
  .map iframe{display:block;width:100%;height:340px;border:0;filter:grayscale(1) contrast(1.05) sepia(.15);}

  /* programação */
  .timeline{list-style:none;max-width:460px;margin:8px auto 0;text-align:left;position:relative;}
  .timeline li{display:grid;grid-template-columns:70px 22px 1fr;align-items:start;gap:10px;padding:14px 0;position:relative;}
  .timeline .t{text-align:right;font-weight:700;letter-spacing:.04em;}
  .timeline .d{position:relative;height:100%;}
  .timeline .d::before{content:'';position:absolute;left:50%;top:-14px;bottom:-14px;width:1px;background:rgba(168,115,30,.5);}
  .timeline li:first-child .d::before{top:14px;}
  .timeline li:last-child .d::before{bottom:calc(100% - 14px);}
  .timeline .d::after{content:'';position:absolute;left:50%;top:8px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--gold-3);}
  .timeline .x{font-size:1.3rem;}

  /* paleta do dress code */
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;margin-top:8px;}
  .sw{width:92px;}
  .sw i{display:block;width:58px;height:58px;border-radius:50%;margin:0 auto 10px;border:1px solid rgba(20,18,16,.25);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 6px 10px rgba(40,30,15,.14);}
  .sw span{display:block;font-size:1.05rem;line-height:1.2;}
  .reserved{background:var(--ink);color:var(--cream-hi);border-radius:16px;padding:32px 24px;position:relative;box-shadow:0 12px 22px rgba(20,18,16,.35);}
  .reserved::after{content:'';position:absolute;inset:7px;border:1px solid rgba(217,180,97,.5);border-radius:10px;pointer-events:none;}
  .reserved .label{color:var(--gold-2);}
  .reserved .name{font-size:4rem;margin:6px auto 2px;width:max-content;}
  .reserved i{display:block;width:46px;height:46px;border-radius:50%;margin:0 auto;border:2px solid var(--gold-2);}
  .reserved p{max-width:420px;margin:0 auto;font-size:1.2rem;color:#E4DCCB;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:center;}
  @media(max-width:600px){.cols{grid-template-columns:1fr;}}
  .cols h3{font-family:var(--font-script);font-weight:400;font-size:3.2rem;line-height:1;margin-bottom:4px;}
  .cols p{font-size:1.15rem;color:var(--ink-soft);}

  /* presentes */
  .gifts{display:flex;flex-direction:column;gap:18px;text-align:left;}
  .gift{display:grid;grid-template-columns:1fr auto;gap:10px 22px;align-items:center;}
  .gift h3{font-size:1.65rem;font-weight:600;line-height:1.15;}
  .gift p{font-size:1.12rem;color:var(--ink-soft);margin-top:4px;}
  .gift .price{font-style:italic;font-size:1.5rem;margin-top:8px;display:block;}
  .gift .st{display:block;margin-top:8px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold-1);}
  .gift .side{align-self:center;}
  @media(max-width:560px){.gift{grid-template-columns:1fr;}.gift .btn{width:100%;}}
  .fine{font-size:1.05rem;color:var(--ink-soft);margin-top:22px;font-style:italic;}

  /* navegação entre páginas e rodapé */
  .more{margin-top:76px;}
  .more .btns{margin-top:16px;}
  .closing{margin-top:76px;}
  .closing .espero{font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase;}
  .closing .mono{width:210px;margin-top:10px;}

  /* modal e aviso */
  .overlay{position:fixed;inset:0;background:rgba(20,18,16,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:440px;padding:42px 30px 30px;position:relative;border-radius:16px;max-height:94vh;overflow-y:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .modal::after{content:'';position:absolute;inset:7px;border:1px solid rgba(168,115,30,.4);border-radius:11px;pointer-events:none;}
  .modal h3{font-family:var(--font-script);font-weight:400;font-size:3.4rem;line-height:1;}
  .modal p{color:var(--ink-soft);font-size:1.12rem;margin-top:8px;}
  .modal .x{position:absolute;top:12px;right:14px;font-size:1.3rem;padding:10px;color:var(--ink-soft);z-index:2;}
  .timer{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:20px 0 14px;}
  .timer b{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .timer span{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);}
  .field{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(20,18,16,.3);padding:12px 2px;font:inherit;font-size:1.15rem;color:var(--ink);margin-bottom:10px;border-radius:0;}
  .field:focus{outline:none;border-color:var(--ink);}
  .field::placeholder{color:var(--ink-soft);opacity:.8;}
  .modal .btn{width:100%;margin-top:10px;position:relative;z-index:2;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--gold-4);padding:14px 26px;border-radius:999px;font-size:1.05rem;opacity:0;pointer-events:none;transition:all .3s;z-index:120;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* entrada suave */
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .rise{animation:rise .9s ease both;animation-delay:var(--d,0s);}
  @media(prefers-reduced-motion:reduce){.rise{animation:none;}html{scroll-behavior:auto;}}

  /* ---------- painel dos assessores ---------- */
  .admin .box{padding:26px 22px;text-align:left;margin-top:26px;}
  .admin label{display:block;font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin:18px 0 2px;}
  .field{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(20,18,16,.35);padding:12px 2px;font:inherit;font-size:1.15rem;color:var(--ink);border-radius:0;}
  .field:focus{outline:none;border-color:var(--ink);}
  .field::placeholder{color:var(--ink-soft);opacity:.7;}
  textarea.field{min-height:130px;resize:vertical;}
  select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .admin .btn{margin-top:24px;}
  .admin .btn.small{min-height:40px;padding:0 18px;font-size:.74rem;margin-top:0;}
  .err{color:#8b1e1e;font-size:1.05rem;min-height:1.4em;margin-top:12px;}
  .who{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;font-size:1.05rem;text-align:left;}
  .who span{overflow-wrap:anywhere;}
  .h2{font-size:1.8rem;font-weight:600;line-height:1.2;margin:38px 0 4px;text-align:left;}
  .hint{font-size:1.05rem;color:var(--ink);text-align:left;margin-top:4px;}
  .count{font-size:.9rem;text-align:right;margin-top:2px;}
  .admin .board{margin-top:16px;}
  .item-actions{display:flex;justify-content:flex-end;margin-top:12px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--gold-4);padding:14px 26px;border-radius:999px;font-size:1.05rem;opacity:0;pointer-events:none;transition:all .3s;z-index:120;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .title-img{width:min(82%,340px);margin:0 auto 14px;font-size:0;}
  .title-img img{display:block;width:100%;height:auto;}
  .title-img.luna{width:min(66%,260px);margin-bottom:6px;}
</style>
</head>

  <p class="sub">Área dos assessores. O que for publicado aqui aparece na hora no quadro de avisos da página Detalhes.</p>

  <!-- LOGIN -->
  <section id="login" class="card box">
    <form id="loginForm" autocomplete="on">
      <label for="email">E-mail</label>
      <input class="field" id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input class="field" id="senha" type="password" autocomplete="current-password" required>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
    </form>
  </section>

  <!-- PAINEL -->
  <section id="panel" hidden>
    <div class="who"><span>Conectado como <b id="who"></b></span><button class="btn ghost small" id="logout" type="button">Sair</button></div>

    <form class="card box" id="form">
      <h2 class="h2" style="margin-top:0">Novo aviso</h2>
      <p class="hint">Escolha o tipo, escreva o título e a mensagem e clique em Publicar.</p>
      <label for="type">Tipo</label>
      <select class="field" id="type"><option>Importante</option><option>Aviso</option><option>Comunicado</option></select>
      <label for="title">Título</label>
      <input class="field" id="title" maxlength="80" placeholder="Ex.: Confirmação de presença" required>
      <label for="text">Mensagem</label>
      <textarea class="field" id="text" maxlength="600" placeholder="Escreva o aviso para os convidados..." required></textarea>
      <p class="count"><span id="count">0</span>/600</p>
      <p class="err" id="formErr" role="alert"></p>
      <button class="btn" type="submit" id="publish">Publicar aviso</button>
    </form>

    <h2 class="h2">Avisos publicados</h2>
    <p class="hint">Para tirar um aviso do quadro, use Excluir.</p>
    <div class="board" id="list" aria-live="polite"><p class="empty">Nenhum aviso publicado.</p></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ===== EDITAR: o mesmo firebaseConfig dos outros arquivos ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBq7h2Ad3Z7TzZ666yNO8DyzDdemmi1dsk",
  authDomain: "convites-festacomcarol.firebaseapp.com",
  projectId: "convites-festacomcarol",
  storageBucket: "convites-festacomcarol.firebasestorage.app",
  messagingSenderId: "268847347614",
  appId: "1:268847347614:web:e865b9b38927bee051888f"
};
const EVENT_ID = "luna-xv"; // o mesmo da lista de presentes e da página Detalhes

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3200); }
const fmt = ts => (ts && ts.toDate ? ts.toDate() : new Date()).toLocaleDateString('pt-BR');

/* MODO DEMONSTRAÇÃO: enquanto o firebaseConfig tiver "COLE_AQUI", o painel abre direto,
   sem senha, e os avisos ficam só nesta tela (nada é salvo). Ao colar o config real,
   o login por e-mail e senha passa a ser exigido automaticamente. */
const DEMO = firebaseConfig.apiKey === "COLE_AQUI";
const app  = DEMO ? null : initializeApp(firebaseConfig);
const auth = DEMO ? null : getAuth(app);
const db   = DEMO ? null : getFirestore(app);
const noticesCol = DEMO ? null : collection(db, 'events', EVENT_ID, 'notices');
let demoItems = [
  {id:'d1', type:'Importante', title:'Confirmação de presença', text:'Por favor, confirme sua presença até 15 de novembro pelo botão do convite.', createdAt:null},
  {id:'d2', type:'Aviso', title:'Estacionamento', text:'O Halu possui estacionamento com manobrista no local.', createdAt:null},
];

/* ---------- entrar / sair ---------- */
const LOGIN_ERRORS = {
  'auth/invalid-credential':'E-mail ou senha incorretos.',
  'auth/wrong-password':'E-mail ou senha incorretos.',
  'auth/user-not-found':'E-mail ou senha incorretos.',
  'auth/invalid-email':'Confira o e-mail digitado.',
  'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
  'auth/network-request-failed':'Sem conexão com a internet.',
};
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('loginErr').textContent=''; $('loginBtn').disabled=true;
  try{
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('senha').value);
  }catch(err){
    console.warn(err);
    $('loginErr').textContent = LOGIN_ERRORS[err.code] || 'Não foi possível entrar. Confira se o Firebase está configurado.';
  }finally{ $('loginBtn').disabled=false; }
});
$('logout').addEventListener('click', ()=>{ if(!DEMO) signOut(auth); });

let unsub = null;
if(DEMO){
  $('login').hidden = true; $('panel').hidden = false;
  $('who').textContent = 'MODO DEMONSTRAÇÃO (sem senha, nada é salvo)';
  renderList(demoItems);
}
else onAuthStateChanged(auth, user=>{
  $('login').hidden = !!user;
  $('panel').hidden = !user;
  if(unsub){ unsub(); unsub=null; }
  if(user){
    $('who').textContent = user.email;
    $('senha').value='';
    const q = query(noticesCol, orderBy('createdAt','desc'), limit(100));
    unsub = onSnapshot(q, snap=> renderList(snap.docs.map(d=>({id:d.id, ...d.data()}))), err=>console.warn('Firestore:', err));
  }
});

/* ---------- publicar ---------- */
$('text').addEventListener('input', ()=>{ $('count').textContent = $('text').value.length; });
$('form').addEventListener('submit', async e=>{
  e.preventDefault();
  const type=$('type').value, title=$('title').value.trim(), text=$('text').value.trim();
  $('formErr').textContent='';
  if(!title || !text){ $('formErr').textContent='Preencha o título e a mensagem.'; return; }
  $('publish').disabled=true;
  try{
    if(DEMO){ demoItems.unshift({id:'d'+Date.now(),type,title,text,createdAt:null}); renderList(demoItems); $('title').value=''; $('text').value=''; $('count').textContent='0'; toast('Aviso publicado (demonstração).'); return; }
    await addDoc(noticesCol, { type, title, text, createdAt: serverTimestamp(), author: auth.currentUser.email });
    $('title').value=''; $('text').value=''; $('count').textContent='0';
    toast('Aviso publicado! Já está no quadro.');
  }catch(err){
    console.warn(err);
    $('formErr').textContent = err.code==='permission-denied'
      ? 'Este e-mail não tem permissão para publicar. Peça para incluí-lo nas regras do Firebase.'
      : 'Não foi possível publicar agora. Tente novamente.';
  }finally{ $('publish').disabled=false; }
});

/* ---------- lista e exclusão ---------- */
function renderList(items){
  $('list').innerHTML = items.length ? items.map(n=>`
    <article class="card notice">
      <div class="tag"><span>${esc(n.type)}</span><time>${esc(fmt(n.createdAt))}</time></div>
      <h3>${esc(n.title)}</h3>
      <p>${esc(n.text)}</p>
      <div class="item-actions"><button class="btn ghost small" type="button" data-del="${esc(n.id)}">Excluir</button></div>
    </article>`).join('') : '<p class="empty">Nenhum aviso publicado.</p>';
}
$('list').addEventListener('click', async e=>{
  const b = e.target.closest('[data-del]'); if(!b) return;
  if(!confirm('Excluir este aviso do quadro?')) return;
  if(DEMO){ demoItems=demoItems.filter(x=>x.id!==b.dataset.del); renderList(demoItems); toast('Aviso excluído (demonstração).'); return; }
  try{ await deleteDoc(doc(db, 'events', EVENT_ID, 'notices', b.dataset.del)); toast('Aviso excluído.'); }
  catch(err){ console.warn(err); toast('Não foi possível excluir agora.'); }
});
</script>
</body>
</html>
