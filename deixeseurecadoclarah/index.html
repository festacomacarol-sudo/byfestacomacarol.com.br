    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family:'Jost', sans-serif;
    color: var(--cream);
    min-height:100vh;
    padding: 28px 16px 60px;
  }

  .conteudo{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .card{
    width:100%;
    max-width:460px;
    background: var(--panel);
    border:1px solid var(--panel-line);
    box-shadow: 0 30px 70px rgba(0,0,0,0.45);
    padding: 40px 26px 34px;
  }
  .logo-wrap{
    display:flex;
    justify-content:center;
    margin: 4px 0 18px;
  }
  .logo-wrap img{
    width:100%;
    max-width:300px;
    height:auto;
  }
  .titulo-recado{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:0.08em;
    margin:0 0 16px;
    background: linear-gradient(135deg, #f3e3b8 0%, #cda45e 50%, #8a6a2c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:normal;
    font-size:19px;
    color:#f6f0e2;
    margin:0 0 30px;
    line-height:1.65;
    letter-spacing:0.01em;
  }
  @media (max-width: 480px){
    .titulo-recado{ font-size:23px; }
    .sub{ font-size:17px; }
  }
  form{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  label{
    display:block;
    font-size:0.78rem;
    font-weight:500;
    margin-bottom:8px;
    color: var(--gold-soft);
    letter-spacing:0.03em;
  }
  input[type="text"], textarea{
    width:100%;
    border:1px solid var(--line);
    background: rgba(10, 18, 38, 0.55);
    border-radius:10px;
    padding:14px 15px;
    font-family:'Jost', sans-serif;
    font-size:1rem;
    color: var(--cream);
    resize:none;
    transition:border-color .15s ease;
  }
  input[type="text"]::placeholder, textarea::placeholder{ color: rgba(247,241,228,0.4); }
  input[type="text"]:focus, textarea:focus{
    outline:none;
    border-color: var(--gold);
  }
  textarea{ min-height:120px; line-height:1.5; }

  .photo-field{
    border:1px dashed var(--line);
    border-radius:12px;
    background: rgba(10, 18, 38, 0.55);
    padding:20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .photo-field.has-image{ padding:0; border-style:solid; }
  .photo-field:active{ border-color: var(--gold); }
  .photo-field input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .photo-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color: var(--gold-soft);
  }
  .photo-placeholder svg{ width:28px; height:28px; }
  .photo-placeholder span{ font-size:0.88rem; }
  .preview-img{
    width:100%;
    max-height:340px;
    object-fit:cover;
    display:block;
    border-radius:11px;
  }
  .remove-photo{
    position:absolute;
    top:10px;
    right:10px;
    background: rgba(15,26,51,0.8);
    border:1px solid var(--gold);
    color: var(--gold);
    width:30px;
    height:30px;
    border-radius:50%;
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }

  button.submit{
    margin-top:8px;
    background: linear-gradient(135deg, #C9A24E 0%, #E9D5A2 50%, #C9A24E 100%);
    color: var(--navy-deep);
    border:none;
    padding:16px;
    border-radius:10px;
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  button.submit:active{ transform:scale(0.98); }
  button.submit:disabled{ opacity:0.55; cursor:default; }

  .status{
    text-align:center;
    font-size:0.85rem;
    margin-top:14px;
    min-height:1.2em;
    color: var(--gold-soft);
  }
  .status.error{ color:#E28A8A; }

  .success-screen{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:50px;
    gap:16px;
  }
  .success-screen img{ width:64px; height:64px; opacity:0.9; }
  .success-screen h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:1.9rem;
    margin:6px 0 2px;
    color: var(--gold);
  }
  .success-screen p{ color: var(--gold-soft); font-size:0.95rem; max-width:320px; line-height:1.6; font-family:'Cormorant Garamond', serif;}
  .success-screen button{
    margin-top:18px;
    background:none;
    border:1px solid var(--gold);
    color: var(--gold);
    padding:11px 26px;
    border-radius:10px;
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:0.85rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .rodape-espaco{ height:20px; }
</style>
</head>

    <h1 class="titulo-recado">Deixe seu Recado</h1>
    <p class="sub">Escreva uma mensagem carinhosa para Clarah e, se quiser, anexe uma foto com ela. Vamos passar todas as mensagens em um telão na festa.</p>

    <form id="recadoForm">
      <div>
        <label>SEU NOME</label>
        <input type="text" id="nome" name="nome" placeholder="Como você quer assinar" required maxlength="60">
      </div>

      <div>
        <label>SUA MENSAGEM</label>
        <textarea id="mensagem" name="mensagem" placeholder="Escreva seu recado para ela..." required maxlength="600"></textarea>
      </div>

      <div>
        <label>FOTO (OPCIONAL)</label>
        <div class="photo-field" id="photoField">
          <input type="file" id="foto" name="foto" accept="image/*">
          <div class="photo-placeholder" id="photoPlaceholder">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="6" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 6L9.4 3.6H14.6L16 6" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span>Toque para tirar ou escolher uma foto</span>
          </div>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Enviar recado</button>
      <div class="status" id="status"></div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // 1) Cole aqui o firebaseConfig que você copiou no passo 3
    const firebaseConfig = {
    apiKey: "AIzaSyBbLGPmzOiXlb71pelOkpTvMA5rekx0MuI",
    authDomain: "recados-festas.firebaseapp.com",
    projectId: "recados-festas",
    storageBucket: "recados-festas.firebasestorage.app",
    messagingSenderId: "504948216460",
    appId: "1:504948216460:web:e11ca7546abaee58cb61a9"
  };

  // 2) Cole aqui a API Key do imgbb (passo 4)
  const IMGBB_API_KEY = "b72af0187ed2187cf43d6bdf9bc8c779";

  // Nome da "gaveta" onde os recados vão ficar guardados no Firestore.
  const NOME_DA_COLECAO = "recados-clarah-18-anos";

  // ============================================================
  // Daqui pra baixo é lógica do formulário — não precisa mexer
  // ============================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Faz login anônimo automaticamente assim que a página abre.
  // O convidado não vê nada disso, é transparente.
  const loginAnonimo = signInAnonymously(auth).catch((err) => {
    console.error("Falha no login anônimo:", err);
  });

  const form = document.getElementById("recadoForm");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  const fotoInput = document.getElementById("foto");
  const photoField = document.getElementById("photoField");
  const photoPlaceholder = document.getElementById("photoPlaceholder");
  const formScreen = document.getElementById("formScreen");
  const successScreen = document.getElementById("successScreen");

  let previewEl = null;

  fotoInput.addEventListener("change", () => {
    const file = fotoInput.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    photoPlaceholder.style.display = "none";
    photoField.classList.add("has-image");
    if (previewEl) previewEl.remove();
    previewEl = document.createElement("img");
    previewEl.className = "preview-img";
    previewEl.src = url;
    photoField.appendChild(previewEl);

    if (!photoField.querySelector(".remove-photo")) {
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-photo";
      removeBtn.innerHTML = "&times;";
      removeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        fotoInput.value = "";
        previewEl.remove();
        previewEl = null;
        removeBtn.remove();
        photoField.classList.remove("has-image");
        photoPlaceholder.style.display = "flex";
      });
      photoField.appendChild(removeBtn);
    }
  });

  async function uploadParaImgbb(file) {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const body = new FormData();
    body.append("key", IMGBB_API_KEY);
    body.append("image", base64);

    const resp = await fetch("https://api.imgbb.com/1/upload", {
      method: "POST",
      body
    });
    const data = await resp.json();
    if (!data.success) throw new Error("Falha ao enviar a foto.");
    return data.data.url;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.textContent = "";
    statusEl.classList.remove("error");
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";

    try {
      await loginAnonimo;
      if (!auth.currentUser) throw new Error("Sem conexão. Tente novamente.");

      const nome = document.getElementById("nome").value.trim();
      const mensagem = document.getElementById("mensagem").value.trim();
      const file = fotoInput.files[0];

      let fotoUrl = "";
      if (file) {
        statusEl.textContent = "Enviando foto...";
        fotoUrl = await uploadParaImgbb(file);
      }

      statusEl.textContent = "Salvando recado...";
      await addDoc(collection(db, NOME_DA_COLECAO), {
        nome,
        mensagem,
        foto_url: fotoUrl,
        data_envio: serverTimestamp()
      });

      formScreen.style.display = "none";
      successScreen.style.display = "flex";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Algo deu errado. Verifique sua internet e tente de novo.";
      statusEl.classList.add("error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar recado";
    }
  });
</script>

</body>
