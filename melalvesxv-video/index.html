<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mel Alves · XV Anos</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #232a4a;
    --blush: #f3d9dc;
    --white: #ffffff;
    --font: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }

  .stage { position: fixed; inset: 0; }

  /* fundo desfocado para telas largas (computador) */
  .backdrop {
    position: absolute; inset: -40px;
    width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover;
    filter: blur(40px) brightness(.55);
  }
  .main {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  /* celular em pé: vídeo ocupa a tela toda */
  @media (max-aspect-ratio: 10/16) {
    .main { object-fit: cover; }
    .backdrop { display: none; }
  }

  .btn {
    position: absolute;
    font-family: var(--font);
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--white);
    background: rgba(35, 42, 74, .55);
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 999px;
    padding: .55em 1.3em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background .2s;
  }
  .btn:hover { background: rgba(35, 42, 74, .8); }
  .btn:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }

  .skip {
    right: 16px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .sound {
    left: 16px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    font-style: italic;
  }
  .sound[hidden] { display: none; }

  .bar {
    position: absolute; left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    height: 3px;
    background: rgba(255,255,255,.2);
  }
  .bar span {
    display: block; height: 100%; width: 0;
    background: var(--blush);
  }

  /* tela de toque, só aparece se o navegador bloquear o autoplay */
  .tap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,.45);
    color: var(--white);
    border: 0; cursor: pointer;
    font-family: var(--font);
  }
  .tap[hidden] { display: none; }
  .tap .play {
    width: 84px; height: 84px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.8);
    display: grid; place-items: center;
  }
  .tap .play::after {
    content: ""; margin-left: 6px;
    border-left: 24px solid #fff;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
  }
  .tap p { font-size: 1.4rem; font-style: italic; }
</style>
</head>
<body>
<div class="stage">
  <video class="backdrop" id="backdrop" src="0923.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="main" id="video" src="0923.mp4" playsinline preload="auto" autoplay></video>

  <button class="tap" id="tap" hidden>
    <span class="play"></span>
    <p>Toque para assistir</p>
  </button>

  <button class="btn sound" id="sound" hidden>Ativar som</button>
  <button class="btn skip" id="skip">Pular vídeo</button>
  <div class="bar"><span id="progress"></span></div>
</div>

<script>
  const DESTINO = "https://festacomcarol.com.br/melalvesxv";

  const video = document.getElementById("video");
  const backdrop = document.getElementById("backdrop");
  const tap = document.getElementById("tap");
  const sound = document.getElementById("sound");
  const skip = document.getElementById("skip");
  const progress = document.getElementById("progress");

  let saiu = false;
  function irParaSite() {
    if (saiu) return;
    saiu = true;
    window.location.replace(DESTINO);
  }

  function sincronizarFundo() {
    if (getComputedStyle(backdrop).display === "none") return;
    backdrop.currentTime = video.currentTime;
    backdrop.play().catch(() => {});
  }

  // 1ª tentativa: tocar com som. Se o navegador bloquear, toca sem som.
  // Se bloquear até sem som (modo economia), mostra "toque para assistir".
  async function iniciar() {
    try {
      video.muted = false;
      await video.play();
    } catch (e) {
      try {
        video.muted = true;
        await video.play();
        sound.hidden = false;
      } catch (e2) {
        tap.hidden = false;
      }
    }
    sincronizarFundo();
  }

  tap.addEventListener("click", () => {
    tap.hidden = true;
    video.muted = false;
    sound.hidden = true;
    video.play().then(sincronizarFundo).catch(() => { tap.hidden = false; });
  });

  sound.addEventListener("click", () => {
    video.muted = false;
    sound.hidden = true;
  });

  skip.addEventListener("click", irParaSite);
  video.addEventListener("ended", irParaSite);
  video.addEventListener("error", irParaSite); // se o vídeo não carregar, vai direto pro site

  video.addEventListener("timeupdate", () => {
    if (video.duration) {
      progress.style.width = (video.currentTime / video.duration * 100) + "%";
    }
  });

  iniciar();
</script>
</body>
</html>
