<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ana Luiza | Sweet Sixteen</title>
<style>
  :root{
    --rose-deep:#b5546a;
    --rose-mid:#d98a95;
    --cream:#fdf6f3;
    --gold:#c79a5c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--cream);
    font-family:Georgia,'Times New Roman',serif;
    overflow-x:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(217,138,149,0.18), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(199,154,92,0.15), transparent 55%),
      var(--cream);
  }
  a.cover-link{
    display:block;
    position:relative;
    width:min(420px, 92vw);
    aspect-ratio:1080/1920;
    text-decoration:none;
    border-radius:6px;
    overflow:hidden;
    box-shadow:
      0 2px 6px rgba(90,40,50,0.12),
      0 18px 40px -12px rgba(90,40,50,0.35);
    transform:translateY(0);
    animation:rise 1.1s cubic-bezier(.19,1,.22,1) both;
    isolation:isolate;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(22px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  a.cover-link img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cta{
    position:absolute;
    left:0; right:0;
    bottom:5.5%;
    text-align:center;
    font-family:Georgia,serif;
    font-size:12px;
    letter-spacing:0.32em;
    color:#8a4a55;
    text-shadow:0 1px 2px rgba(255,255,255,0.6);
    pointer-events:none;
  }
  .cta span{
    display:inline-block;
    padding:0.5em 0;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.65;}
    50%{opacity:1;}
  }
  .sheen{
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    transform:translateX(-120%);
    pointer-events:none;
    mix-blend-mode:soft-light;
  }
  a.cover-link:hover .sheen{
    animation:sheen-sweep 1.1s ease forwards;
  }
  @keyframes sheen-sweep{
    to{transform:translateX(120%);}
  }
  a.cover-link:active{
    transform:scale(0.985);
    transition:transform .15s ease;
  }
  @media (prefers-reduced-motion: reduce){
    a.cover-link{animation:none;}
    .cta span{animation:none;}
  }
  footer{
    position:fixed;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    left:0; right:0;
    text-align:center;
    font-family:Georgia,serif;
    font-size:10px;
    letter-spacing:0.15em;
    color:#c9a4ab;
  }
</style>
</head>
