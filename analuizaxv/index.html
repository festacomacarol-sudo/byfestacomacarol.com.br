<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ana Luiza | Sweet Sixteen</title>
<style>
  :root{
    --rose-deep:#b5546a;
    --rose-mid:#d98a95;
    --cream:#fdf6f3;
    --gold:#c79a5c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--cream);
    font-family:Georgia,'Times New Roman',serif;
    overflow-x:hidden;
    overflow-y:auto;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    gap:26px;
    padding:32px 16px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(217,138,149,0.18), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(199,154,92,0.15), transparent 55%),
      var(--cream);
  }
  .cover-wrap{
    position:relative;
    max-width:min(420px, 92vw);
    max-height:70vh;
    border-radius:6px;
    overflow:hidden;
    line-height:0;
    box-shadow:
      0 2px 6px rgba(90,40,50,0.12),
      0 18px 40px -12px rgba(90,40,50,0.35);
    animation:rise 1.1s cubic-bezier(.19,1,.22,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(22px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .cover-wrap img{
    display:block;
    width:auto;
    height:auto;
    max-width:min(420px, 92vw);
    max-height:70vh;
    object-fit:contain;
  }
  .sheen{
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    transform:translateX(-120%);
    pointer-events:none;
    mix-blend-mode:soft-light;
    animation:sheen-sweep 2.6s ease-in-out 0.6s 1;
  }
  @keyframes sheen-sweep{
    to{transform:translateX(120%);}
  }

  .cta-button{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    font-family:Georgia,serif;
    font-size:14px;
    letter-spacing:0.28em;
    color:var(--cream);
    background:linear-gradient(135deg, var(--rose-deep), #9a3f52);
    padding:16px 40px;
    border-radius:999px;
    box-shadow:
      0 6px 18px -4px rgba(154,63,82,0.55),
      inset 0 1px 0 rgba(255,255,255,0.25);
    border:1px solid rgba(255,255,255,0.25);
    animation:rise 1.1s cubic-bezier(.19,1,.22,1) 0.15s both, glow 2.6s ease-in-out infinite;
    transition:transform .2s ease, box-shadow .2s ease;
    cursor:pointer;
  }
  .cta-button:hover{
    transform:translateY(-2px);
    box-shadow:
      0 10px 24px -4px rgba(154,63,82,0.6),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .cta-button:active{
    transform:translateY(0) scale(0.98);
  }
  @keyframes glow{
    0%,100%{box-shadow:0 6px 18px -4px rgba(154,63,82,0.55), inset 0 1px 0 rgba(255,255,255,0.25);}
    50%{box-shadow:0 8px 26px -2px rgba(199,154,92,0.55), inset 0 1px 0 rgba(255,255,255,0.3);}
  }

  @media (prefers-reduced-motion: reduce){
    .cover-wrap, .cta-button, .sheen{animation:none;}
  }
</style>
</head>
