<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de Presença — Bruna Cristina XV Anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-bg: #cfdfe6;
    --blue-deep: #93aebb;
    --blue-line: rgba(28,43,74,0.28);
    --navy: #1c2b4a;
    --navy-light: #2e4568;
    --gold: #b8873c;
    --gold-light: #dfc088;
    --gold-deep: #8a662a;
    --cream: #fbf8f2;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, var(--blue-bg) 0%, var(--blue-deep) 100%);
    font-family:'Cormorant Garamond', serif;
    color: var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:520px;
    padding: 34px 34px 38px;
    border: 1.5px solid var(--gold);
    outline: 1px solid rgba(184,135,60,0.25);
    outline-offset: 6px;
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.28));
    box-shadow: 0 25px 60px rgba(28,43,74,0.25);
  }

  .card::before, .card::after{
    content:"";
    position:absolute;
    width: 34px; height: 34px;
    border-top: 2px solid var(--gold);
    border-left: 2px solid var(--gold);
    top: -10px; left: -10px;
  }
  .card::after{
    top:auto; left:auto;
    bottom:-10px; right:-10px;
    border-top:none; border-left:none;
    border-bottom: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }

  .brand{
    text-align:center;
    margin-bottom: 2px;
  }

  .bow-img{
    width: 92px;
    height:auto;
    display:block;
    margin: 0 auto;
    position:relative;
    z-index:2;
  }

  .logo-img{
    width: 320px;
    max-width:85%;
    height:auto;
    display:block;
    margin: -6px auto 0;
    position:relative;
    z-index:1;
  }

  .rule{
    width: 64px;
    height: 1px;
    background: var(--blue-line);
    margin: 14px auto 22px;
  }

  .subtitle{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    font-size: 1rem;
    color: var(--navy);
    margin-bottom: 26px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 22px;
  }

  .field label{
    display:block;
    font-family:'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .hint{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(28,43,74,0.65);
    margin-top: 6px;
  }

  textarea, input[type="number"]{
    width:100%;
    background: rgba(255,255,255,0.5);
    border: none;
    border-bottom: 1.5px solid var(--blue-line);
    color: var(--navy);
    font-family:'Cormorant Garamond', serif;
    font-size: 1.15rem;
    padding: 8px 6px;
    resize: vertical;
    min-height: 46px;
  }

  input[type="number"]{ min-height:auto; }

  textarea:focus, input[type="number"]:focus{
    outline:none;
    border-bottom-color: var(--gold);
  }

  .choice-group{
    display:flex;
    gap: 14px;
  }

  .choice{
    flex:1;
    position:relative;
  }

  .choice input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    top:0; left:0;
    margin:0;
    cursor:pointer;
  }

  .choice span{
    display:block;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    padding: 12px 8px;
    border: 1px solid var(--blue-line);
    border-radius: 3px;
    color: var(--navy);
    background: rgba(255,255,255,0.35);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .choice input:checked + span{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--cream);
    font-weight: 600;
  }

  #idadeWrap{
    max-height: 220px;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
  }
  #idadeWrap.hidden{
    max-height: 0;
    opacity: 0;
  }

  .idade-row{
    display:flex;
    gap: 14px;
  }
  .idade-row > div{ flex:1; }
  .idade-row label{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    letter-spacing: 0;
    color: rgba(28,43,74,0.8);
    margin-bottom: 4px;
  }

  button{
    margin-top: 8px;
    background: var(--navy);
    color: var(--gold-light);
    border: none;
    font-family:'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    font-size: 0.92rem;
    padding: 14px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover{ background: var(--navy-light); }
  button:active{ transform: scale(0.99); }

  .footer-note{
    text-align:center;
    margin-top: 18px;
    font-size: 0.85rem;
    font-style: italic;
    color: rgba(28,43,74,0.6);
  }

  .error{
    color: #a4372c;
    font-size: 0.85rem;
    font-style: italic;
    display:none;
  }
</style>
</head>

  <div class="rule"></div>
  <div class="subtitle">Confirmação de Presença</div>

  <form id="rsvpForm">
    <div class="field">
      <label for="nomes">Nome dos convidados incluídos neste convite</label>
      <textarea id="nomes" required placeholder="Ex.: Maria Silva e João Silva"></textarea>
      <span class="hint">Escreva o nome de todos que constam neste convite individual.</span>
    </div>

    <div class="field">
      <label>Irá à festa?</label>
      <div class="choice-group">
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Sim" required>
          <span>Sim, estarei presente</span>
        </label>
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Não">
          <span>Não poderei ir</span>
        </label>
      </div>
    </div>

    <div class="field" id="idadeWrap">
      <label>Entre os confirmados acima, quantos são:</label>
      <div class="idade-row">
        <div>
          <label for="criancas">Crianças (até 12 anos)</label>
          <input type="number" id="criancas" min="0" step="1" value="0">
        </div>
        <div>
          <label for="adolescentes">Adolescentes (13 a 17 anos)</label>
          <input type="number" id="adolescentes" min="0" step="1" value="0">
        </div>
      </div>
      <span class="hint">Não é possível incluir convidados além dos nomes citados no convite individual.</span>
    </div>

    <button type="submit">Enviar confirmação</button>
    <div class="error" id="formError">Por favor, preencha o nome e informe se irá à festa.</div>
  </form>

  <div class="footer-note">Sua resposta será enviada por WhatsApp.</div>
</div>

<script>
  // Número de WhatsApp que receberá as confirmações (formato internacional, sem espaços/símbolos).
  // Ex.: 55 11 90000-0000 -> "5511900000000"
  const WHATSAPP_NUMBER = "5511995614312";

  const form = document.getElementById('rsvpForm');
  const vaiFestaRadios = document.querySelectorAll('input[name="vaiFesta"]');
  const idadeWrap = document.getElementById('idadeWrap');
  const formError = document.getElementById('formError');

  function toggleIdade(){
    const selected = document.querySelector('input[name="vaiFesta"]:checked');
    if (selected && selected.value === "Não") {
      idadeWrap.classList.add('hidden');
    } else {
      idadeWrap.classList.remove('hidden');
    }
  }
  vaiFestaRadios.forEach(r => r.addEventListener('change', toggleIdade));

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const nomes = document.getElementById('nomes').value.trim();
    const vaiFestaEl = document.querySelector('input[name="vaiFesta"]:checked');
    const criancasEl = document.getElementById('criancas');
    const adolescentesEl = document.getElementById('adolescentes');

    if (!nomes || !vaiFestaEl) {
      formError.style.display = 'block';
      return;
    }
    formError.style.display = 'none';

    const vaiFesta = vaiFestaEl.value;
    const criancas = vaiFesta === "Sim" ? (criancasEl.value || "0") : "0";
    const adolescentes = vaiFesta === "Sim" ? (adolescentesEl.value || "0") : "0";

    let mensagem = `Confirmação de presença - Bruna Cristina XV Anos%0A%0A`;
    mensagem += `Convidados: ${encodeURIComponent(nomes)}%0A`;
    mensagem += `Vai à festa: ${encodeURIComponent(vaiFesta)}%0A`;
    if (vaiFesta === "Sim") {
      mensagem += `Crianças (até 12 anos): ${encodeURIComponent(criancas)}%0A`;
      mensagem += `Adolescentes (13 a 17 anos): ${encodeURIComponent(adolescentes)}%0A`;
    }

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensagem}`;
    window.open(url, '_blank');
  });

  toggleIdade();
</script>

</body>
