<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de Presença — Lorena Mayumi XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep: #3d0a15;
    --wine: #5a1020;
    --wine-light: #6e1626;
    --gold: #cda45e;
    --gold-light: #e6cd97;
    --cream: #f3e9d2;
    --line: rgba(205,164,94,0.45);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, var(--wine-light) 0%, var(--wine) 45%, var(--wine-deep) 100%);
    font-family:'Cormorant Garamond', serif;
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:520px;
    padding: 40px 34px 38px;
    border: 1.5px solid var(--gold);
    outline: 1px solid rgba(205,164,94,0.25);
    outline-offset: 6px;
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.18));
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  }

  .card::before, .card::after{
    content:"";
    position:absolute;
    width: 34px; height: 34px;
    border-top: 2px solid var(--gold);
    border-left: 2px solid var(--gold);
    top: -10px; left: -10px;
  }
  .card::after{
    top:auto; left:auto;
    bottom:-10px; right:-10px;
    border-top:none; border-left:none;
    border-bottom: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }

  .brand{
    text-align:center;
    margin-bottom: 2px;
  }

  .mask-img{
    width: 150px;
    height:auto;
    display:block;
    margin: -14px auto 0;
    position:relative;
    z-index:2;
  }

  .logo-img{
    width: 300px;
    max-width:80%;
    height:auto;
    display:block;
    margin: -16px auto 0;
    position:relative;
    z-index:1;
  }

  .rule{
    width: 64px;
    height: 1px;
    background: var(--line);
    margin: 16px auto 22px;
  }

  .subtitle{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    font-size: 1rem;
    color: var(--cream);
    margin-bottom: 26px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 22px;
  }

  .field label{
    display:block;
    font-family:'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    color: var(--gold-light);
    margin-bottom: 8px;
  }

  .hint{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(243,233,210,0.65);
    margin-top: 6px;
  }

  textarea, input[type="number"]{
    width:100%;
    background: rgba(0,0,0,0.18);
    border: none;
    border-bottom: 1.5px solid var(--line);
    color: var(--cream);
    font-family:'Cormorant Garamond', serif;
    font-size: 1.15rem;
    padding: 8px 6px;
    resize: vertical;
    min-height: 46px;
  }

  input[type="number"]{ min-height:auto; }

  textarea:focus, input[type="number"]:focus{
    outline:none;
    border-bottom-color: var(--gold);
  }

  .choice-group{
    display:flex;
    gap: 14px;
  }

  .choice{
    flex:1;
    position:relative;
  }

  .choice input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    top:0; left:0;
    margin:0;
    cursor:pointer;
  }

  .choice span{
    display:block;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    padding: 12px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--cream);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .choice input:checked + span{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--wine-deep);
    font-weight: 600;
  }

  #idadeWrap{
    max-height: 220px;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
  }
  #idadeWrap.hidden{
    max-height: 0;
    opacity: 0;
  }

  .idade-row{
    display:flex;
    gap: 14px;
  }
  .idade-row > div{ flex:1; }
  .idade-row label{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    letter-spacing: 0;
    color: rgba(243,233,210,0.8);
    margin-bottom: 4px;
  }

  button{
    margin-top: 8px;
    background: var(--gold);
    color: var(--wine-deep);
    border: none;
    font-family:'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    font-size: 0.92rem;
    padding: 14px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover{ background: var(--gold-light); }
  button:active{ transform: scale(0.99); }

  .footer-note{
    text-align:center;
    margin-top: 18px;
    font-size: 0.85rem;
    font-style: italic;
    color: rgba(243,233,210,0.6);
  }

  .error{
    color: #e7b3ab;
    font-size: 0.85rem;
    font-style: italic;
    display:none;
  }
</style>
</head>

  <div class="rule"></div>
  <div class="subtitle">Confirmação de Presença</div>

  <form id="rsvpForm">
    <div class="field">
      <label for="nomes">Nome dos convidados incluídos neste convite</label>
      <textarea id="nomes" required placeholder="Ex.: Maria Silva e João Silva"></textarea>
      <span class="hint">Escreva o nome de todos que constam neste convite individual.</span>
    </div>

    <div class="field">
      <label>Irá à festa?</label>
      <div class="choice-group">
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Sim" required>
          <span>Sim, estarei presente</span>
        </label>
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Não">
          <span>Não poderei ir</span>
        </label>
      </div>
    </div>

    <div class="field" id="idadeWrap">
      <label>Entre os confirmados acima, quantos são:</label>
      <div class="idade-row">
        <div>
          <label for="criancas">Crianças (até 12 anos)</label>
          <input type="number" id="criancas" min="0" step="1" value="0">
        </div>
        <div>
          <label for="adolescentes">Adolescentes (13 a 17 anos)</label>
          <input type="number" id="adolescentes" min="0" step="1" value="0">
        </div>
      </div>
      <span class="hint">Não é possível incluir convidados além dos nomes citados no convite individual.</span>
    </div>

    <button type="submit">Enviar confirmação</button>
    <div class="error" id="formError">Por favor, preencha o nome e informe se irá à festa.</div>
  </form>

  <div class="footer-note">Sua resposta será enviada por WhatsApp.</div>
</div>

<script>
  // Número de WhatsApp que receberá as confirmações (formato internacional, sem espaços/símbolos).
  // Ex.: 55 11 94765-0896 -> "5511947650896"
  const WHATSAPP_NUMBER = "5511947650896";

  const form = document.getElementById('rsvpForm');
  const vaiFestaRadios = document.querySelectorAll('input[name="vaiFesta"]');
  const idadeWrap = document.getElementById('idadeWrap');
  const formError = document.getElementById('formError');

  function toggleIdade(){
    const selected = document.querySelector('input[name="vaiFesta"]:checked');
    if (selected && selected.value === "Não") {
      idadeWrap.classList.add('hidden');
    } else {
      idadeWrap.classList.remove('hidden');
    }
  }
  vaiFestaRadios.forEach(r => r.addEventListener('change', toggleIdade));

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const nomes = document.getElementById('nomes').value.trim();
    const vaiFestaEl = document.querySelector('input[name="vaiFesta"]:checked');
    const criancasEl = document.getElementById('criancas');
    const adolescentesEl = document.getElementById('adolescentes');

    if (!nomes || !vaiFestaEl) {
      formError.style.display = 'block';
      return;
    }
    formError.style.display = 'none';

    const vaiFesta = vaiFestaEl.value;
    const criancas = vaiFesta === "Sim" ? (criancasEl.value || "0") : "0";
    const adolescentes = vaiFesta === "Sim" ? (adolescentesEl.value || "0") : "0";

    let mensagem = `Confirmação de presença - Lorena Mayumi XV%0A%0A`;
    mensagem += `Convidados: ${encodeURIComponent(nomes)}%0A`;
    mensagem += `Vai à festa: ${encodeURIComponent(vaiFesta)}%0A`;
    if (vaiFesta === "Sim") {
      mensagem += `Crianças (até 12 anos): ${encodeURIComponent(criancas)}%0A`;
      mensagem += `Adolescentes (13 a 17 anos): ${encodeURIComponent(adolescentes)}%0A`;
    }

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensagem}`;
    window.open(url, '_blank');
  });
