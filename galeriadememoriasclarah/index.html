    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family:'Jost', sans-serif;
    color: var(--cream);
    min-height:100vh;
    padding: 28px 16px 60px;
  }

  .conteudo{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .painel{
    width:100%;
    max-width:1080px;
    background: var(--panel);
    border:1px solid var(--panel-line);
    box-shadow: 0 30px 70px rgba(0,0,0,0.45);
    padding: 40px 26px 50px;
  }

  .top-logo{
    display:block;
    width: 280px;
    max-width: 88%;
    margin: 4px auto 18px;
  }
  .titulo{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.08em;
    margin:0 0 10px;
    background: linear-gradient(135deg, #f3e3b8 0%, #cda45e 50%, #8a6a2c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  @media (max-width: 480px){
    .titulo{ font-size:22px; }
  }
  .sub{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:normal;
    font-size:18px;
    color:#f6f0e2;
    margin:0 0 8px;
    line-height:1.5;
  }
  .contador{
    text-align:center;
    font-size:0.8rem;
    letter-spacing:0.04em;
    color: var(--gold-soft);
    margin:0 0 36px;
  }
  .contador span{ font-weight:600; color:var(--gold); }

  .grade{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:20px;
  }

  .recado-card{
    background: rgba(255,255,255,0.03);
    border:1px solid var(--panel-line);
    border-radius:12px;
    overflow:hidden;
  }
  .recado-card .foto-wrap{
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .recado-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sem-foto{ color: var(--gold-soft); font-size:0.8rem; font-family:'Cormorant Garamond', serif; font-style:italic; }

  .recado-card .video-wrap{ width:100%; aspect-ratio: 16/9; background:#000; }
  .recado-card video{ width:100%; height:100%; object-fit:contain; display:block; }
  .recado-audio{ width:100%; margin: 4px 0 10px; height:38px; }

  .recado-body{ padding:16px 16px 18px; display:block; }
  .recado-nome{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color: var(--gold-soft);
  }
  .recado-data{ font-size:0.72rem; color: rgba(231,207,160,0.6); margin-top:-4px; margin-bottom:8px; }
  .recado-msg{
    font-family:'Cormorant Garamond', serif;
    font-size:1.05rem;
    line-height:1.5;
    color: var(--cream);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    margin:0 0 8px;
  }

  .recado-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .recado-actions a, .recado-actions button{
    flex:1;
    min-width:110px;
    text-align:center;
    font-family:'Jost', sans-serif;
    font-size:0.78rem;
    font-weight:500;
    letter-spacing:0.03em;
    padding:9px 6px;
    border-radius:9px;
    cursor:pointer;
    text-decoration:none;
    border:1px solid var(--line);
    background:rgba(212,175,106,0.08);
    color: var(--gold-soft);
  }
  .recado-actions .excluir{
    border-color: rgba(226,138,138,0.35);
    color: var(--red);
    background: rgba(226,138,138,0.08);
  }

  #vazio, #carregando{
    grid-column:1/-1;
    text-align:center;
    color: var(--gold-soft);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.1rem;
    padding:60px 20px;
  }
</style>
</head>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbLGPmzOiXlb71pelOkpTvMA5rekx0MuI",
    authDomain: "recados-festas.firebaseapp.com",
    projectId: "recados-festas",
    storageBucket: "recados-festas.firebasestorage.app",
    messagingSenderId: "504948216460",
    appId: "1:504948216460:web:e11ca7546abaee58cb61a9"
  };

  // Mesmo nome de coleção usado no recados-clarah.html
  const NOME_DA_COLECAO = "recados-clarah-18-anos";

  // Senha pra poder excluir um recado direto na galeria.
  // Aviso: é só uma trava simples (não é segurança de verdade), mas já
  // evita que alguém apague um recado sem querer/de brincadeira.
  const SENHA_EXCLUIR = "4321";

  // ============================================================
  // Daqui pra baixo é lógica da galeria — não precisa mexer
  // ============================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  const mensagensPorId = {};

  function formatarData(timestamp) {
    if (!timestamp) return "";
    const d = timestamp.toDate();
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function carregarRecados() {
    const q = query(collection(db, NOME_DA_COLECAO), orderBy("data_envio", "desc"));
    onSnapshot(q, (snapshot) => {
      contador.textContent = snapshot.size;
      if (snapshot.empty) {
        lista.innerHTML = '<div id="vazio">Nenhuma memória recebida ainda.</div>';
        return;
      }
      lista.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const r = docSnap.data();
        mensagensPorId[docSnap.id] = r.mensagem || "";
        const card = document.createElement("div");
        card.className = "recado-card";

        const temFoto = !!r.foto_url;
        const temAudio = !!r.audio_url;
        const temVideo = !!r.video_url;

        let midiaTopoHtml;
        if (temFoto) {
          midiaTopoHtml = `<div class="foto-wrap"><img src="${r.foto_url}" alt="Foto enviada por ${escapeHtml(r.nome)}"></div>`;
        } else if (temVideo) {
          midiaTopoHtml = `<div class="video-wrap"><video controls src="${r.video_url}"></video></div>`;
        } else {
          midiaTopoHtml = `<div class="foto-wrap"><span class="sem-foto">Sem foto</span></div>`;
        }

        const audioHtml = temAudio
          ? `<audio class="recado-audio" controls src="${r.audio_url}"></audio>`
          : "";

        card.innerHTML = `
          ${midiaTopoHtml}
          <div class="recado-body">
            <div class="recado-nome">${escapeHtml(r.nome || "Sem nome")}</div>
            <div class="recado-data">${formatarData(r.data_envio)}</div>
            <div class="recado-msg">${escapeHtml(r.mensagem || "")}</div>
            ${audioHtml}
            <div class="recado-actions">
              <button class="copiar" data-id="${docSnap.id}">Copiar mensagem</button>
              ${temFoto ? `<a href="${r.foto_url}" target="_blank" rel="noopener">Baixar foto</a>` : ""}
              ${temVideo ? `<a href="${r.video_url}" target="_blank" rel="noopener">Baixar vídeo</a>` : ""}
              ${temAudio ? `<a href="${r.audio_url}" target="_blank" rel="noopener">Baixar áudio</a>` : ""}
              <button class="excluir" data-id="${docSnap.id}">Excluir</button>
            </div>
          </div>
        `;
        lista.appendChild(card);
      });

      lista.querySelectorAll(".excluir").forEach((btn) => {
        btn.addEventListener("click", () => excluirRecado(btn.dataset.id));
      });

      lista.querySelectorAll(".copiar").forEach((btn) => {
        btn.addEventListener("click", () => copiarMensagem(btn));
      });
    });
  }

  async function copiarMensagem(btn) {
    const texto = mensagensPorId[btn.dataset.id] || "";
    const textoOriginal = btn.textContent;
    try {
      await navigator.clipboard.writeText(texto);
      btn.textContent = "Copiado!";
    } catch (err) {
      console.error(err);
      btn.textContent = "Não foi possível copiar";
    }
    setTimeout(() => { btn.textContent = textoOriginal; }, 1800);
  }

  async function excluirRecado(id) {
    const senha = window.prompt("Digite a senha para excluir esta memória:");
    if (senha === null) return;
    if (senha !== SENHA_EXCLUIR) {
      window.alert("Senha incorreta.");
      return;
    }
    if (!window.confirm("Excluir esta memória? Essa ação não pode ser desfeita.")) return;
    try {
      await deleteDoc(doc(db, NOME_DA_COLECAO, id));
    } catch (err) {
      console.error(err);
      window.alert("Não foi possível excluir. Tente novamente.");
    }
  }

  signInAnonymously(auth)
    .then(() => carregarRecados())
    .catch((err) => {
      console.error("Falha no login anônimo:", err);
      lista.innerHTML = '<div id="vazio">Não foi possível conectar. Recarregue a página.</div>';
    });
</script>

</body>
</html>
