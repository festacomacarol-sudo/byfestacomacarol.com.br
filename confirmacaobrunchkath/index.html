    background-size: 320px auto;
    background-repeat: repeat;
    opacity: 0.10;
    z-index: 0;
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    padding: 36px 34px 38px;
    border: 1.5px solid var(--gold);
    outline: 1px solid rgba(205,158,57,0.25);
    outline-offset: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.82);
    box-shadow: 0 25px 60px rgba(107,74,79,0.18);
  }

  .card::before, .card::after{
    content:"";
    position:absolute;
    width: 34px; height: 34px;
    border-top: 2px solid var(--gold);
    border-left: 2px solid var(--gold);
    top: -10px; left: -10px;
  }
  .card::after{
    top:auto; left:auto;
    bottom:-10px; right:-10px;
    border-top:none; border-left:none;
    border-bottom: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }

  .brand{
    text-align:center;
    margin-bottom: 4px;
  }

  .brasao-img{
    width: 130px;
    height:auto;
    display:block;
    margin: 0 auto;
  }

  .logo-img{
    width: 300px;
    max-width:88%;
    height:auto;
    display:block;
    margin: 4px auto 0;
  }

  .rule{
    width: 64px;
    height: 1px;
    background: rgba(205,158,57,0.4);
    margin: 16px auto 22px;
  }

  .subtitle{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    font-size: 1rem;
    color: var(--pink-deep);
    margin-bottom: 26px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 22px;
  }

  .field label{
    display:block;
    font-family:'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    color: var(--pink-deep);
    margin-bottom: 8px;
  }

  .hint{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(107,74,79,0.65);
    margin-top: 6px;
  }

  .guest-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 12px;
  }

  textarea, input[type="text"]{
    width:100%;
    background: rgba(229,121,140,0.06);
    border: none;
    border-bottom: 1.5px solid rgba(205,158,57,0.35);
    color: var(--text);
    font-family:'Cormorant Garamond', serif;
    font-size: 1.15rem;
    padding: 8px 6px;
  }

  textarea:focus, input[type="text"]:focus{
    outline:none;
    border-bottom-color: var(--pink);
  }

  .choice-group{
    display:flex;
    gap: 14px;
  }

  .choice{
    flex:1;
    position:relative;
  }

  .choice input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    top:0; left:0;
    margin:0;
    cursor:pointer;
  }

  .choice span{
    display:block;
    text-align:center;
    font-family:'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    padding: 12px 8px;
    border: 1px solid rgba(205,158,57,0.35);
    border-radius: 3px;
    color: var(--text);
    background: rgba(255,255,255,0.4);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .choice input:checked + span{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
    font-weight: 600;
  }

  button[type="submit"]{
    margin-top: 8px;
    background: var(--pink);
    color: #fff;
    border: none;
    font-family:'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    font-size: 0.92rem;
    padding: 14px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button[type="submit"]:hover{ background: var(--pink-deep); }
  button[type="submit"]:active{ transform: scale(0.99); }

  .footer-note{
    text-align:center;
    margin-top: 18px;
    font-size: 0.85rem;
    font-style: italic;
    color: rgba(107,74,79,0.6);
  }

  .error{
    color: #a4372c;
    font-size: 0.85rem;
    font-style: italic;
    display:none;
  }

</style>
</head>

  <div class="rule"></div>
  <div class="subtitle">Confirmação de Presença</div>

  <form id="rsvpForm">
    <div class="field">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Seu nome" required>
    </div>

    <div class="field">
      <label>Irá à festa?</label>
      <div class="choice-group">
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Sim" required>
          <span>Sim, estarei presente</span>
        </label>
        <label class="choice">
          <input type="radio" name="vaiFesta" value="Não">
          <span>Não poderei ir</span>
        </label>
      </div>
    </div>

    <button type="submit">Enviar confirmação</button>
    <div class="error" id="formError">Por favor, preencha seu nome e informe se irá à festa.</div>
  </form>

  <div class="footer-note">Sua resposta será enviada por WhatsApp.</div>
</div>

<script>
  // Número de WhatsApp que receberá as confirmações (formato internacional, sem espaços/símbolos).
  const WHATSAPP_NUMBER = "5512991553089";

  const form = document.getElementById('rsvpForm');
  const formError = document.getElementById('formError');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const vaiFestaEl = document.querySelector('input[name="vaiFesta"]:checked');

    if (!nome || !vaiFestaEl) {
      formError.style.display = 'block';
      return;
    }
    formError.style.display = 'none';

    const vaiFesta = vaiFestaEl.value;

    let mensagem = `Confirmação de presença - Katherine Monegatto XV Anos%0A%0A`;
    mensagem += `Nome: ${encodeURIComponent(nome)}%0A`;
    mensagem += `Vai à festa: ${encodeURIComponent(vaiFesta)}%0A`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensagem}`;
    window.open(url, '_blank');
  });
</script>
